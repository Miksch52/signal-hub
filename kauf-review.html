<style>
  /* Gleiches Design wie setup-detail.html ("Tagesordnung", seit 2026-08-09) -
     Signal-Hub-Familie, siehe CLAUDE.md Anleitungsseiten-Regel (drei
     Design-Systeme, nicht angleichen). Kartenbasiertes Layout statt
     Fließtext, da diese Seite zum schnellen sequenziellen Durchgehen auf

  :root{
    --primary:#1F6E66; --ok:#2E8B57; --warn:#C08A2E; --bad:#B23A2E;

  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--txt);line-height:1.4;

  a{color:var(--primary)}

  header{position:sticky;top:0;z-index:20;background:var(--bg2);

<body>
<header>
  <a class="back" href="signal-hub.html">← Signal Hub</a>
  <h1>🛒 Kauf-Review</h1>
  <span class="progress" id="progress"></span>
</header>
<div class="progressbar"><div class="progressbar-fill" id="progressfill" style="width:0%"></div></div>
<div id="beobachtet"></div>
<div id="toast" role="status"></div>

<main id="main">
  <div id="loading">Lädt Top-Setups …</div>
</main>

<div class="actionbar" id="actionbar" style="display:none">
  <button class="watch" onclick="entscheiden('beobachten')"><span class="ic">👀</span>Beobachten</button>
  <button class="discard" onclick="entscheiden('verworfen')"><span class="ic">✕</span>Verwerfen</button>
  <button class="buy" onclick="kaufen()"><span class="ic">🛒</span>Kaufen</button>
</div>

<script>
// Muss VOR dem "data/top_setups.js"-Tag stehen, nicht in dessen eigenem
// Script-Block weiter unten (Fund beim CI-Test-Gate, Systempruefung
// Punkt 10, 13.09.2026): ein onerror-Attribut feuert, sobald der externe
// <script>-Tag scheitert - bei fehlender data/top_setups.js (jeder frische
// Checkout ohne Pipeline-Lauf, auch der Smoke-Audit-Testlauf per file://)
// war das VOR der Definition von ladeFehlgeschlagen() weiter unten im
// Dokument, also "ladeFehlgeschlagen is not defined". init() selbst wird
// ohnehin unbedingt am Ende des Hauptscripts aufgerufen (siehe dort) und
// liest dort das hier gesetzte ladefehler - der fruehe init()-Aufruf war
// nur redundant, kein Verhaltensunterschied.
let ladefehler = false;
function ladeFehlgeschlagen() { ladefehler = true; }
</script>
<script src="data/top_setups.js" onerror="ladeFehlgeschlagen()"></script>
<script>
const enc = encodeURIComponent;
const WARN = 10;
const KAPITAL_PRESETS = [3000, 5000, 10000, 15000];   // Schnellwahl, Feld bleibt frei editierbar   // Earnings-Warnfenster, konsistent zu index.html/Signal-Hub warnTage()
const IST_STANDALONE_PWA = window.matchMedia('(display-mode: standalone)').matches;

const TT_LABELS = {
  stage2_trend: 'Stage-2-Trend-Template',
  relative_staerke: 'Relative Stärke',
  naehe_52w_hoch: 'Nähe 52W-Hoch',
  basis_konsolidierung: 'Basis-Konsolidierung',
  volumen_bestaetigung: 'Volumen-Bestätigung',
};

let ROTATION_LEADER_MAP = null;
let QUEUE = [];
let GATED_COUNT = 0;
let idx = 0;
let entscheidungen = {};
// ladefehler/ladeFehlgeschlagen() stehen jetzt im ersten <script>-Block oben,
// vor dem "data/top_setups.js"-Tag, siehe Kommentar dort.

function gesperrt(s) { return s.earnings_tage != null && s.earnings_tage >= 0 && s.earnings_tage <= WARN; }
function aktivBar(s) { return s.regime === 'gruen' && !gesperrt(s); }

// Gleiches Muster wie index.html::ladeRotationLeaderMap() - eigener, kleiner
// Ladepfad statt top_setups.py serverseitig mit Rotation-Daten anzureichern
// (price-action-hub/rotation-dashboard laufen als parallele Pipeline-Jobs).
function ladeRotationLeaderMap() {
  const s = document.createElement('script');
  s.src = '../Rotation-Dashboard/data/rotation.js';
  s.onload = () => {
    const leaders = (window.ROTATION_DATA && window.ROTATION_DATA.leaders) || [];
    ROTATION_LEADER_MAP = new Map(leaders.map(l => [l.ticker, l]));
    render();
  };
  s.onerror = () => {};
  document.head.appendChild(s);
}

// ── 👀 Beobachten = Fokusliste der Hauptapp (seit 2026-09-23) ──────────────
// Keine eigene Liste (Entflechtung): „Beobachten“ setzt den Ticker auf die
// SEPA-Watchlist der Hauptapp (localStorage['mts_v2'].watchlist, im Signal-Hub
// „⭐ Fokusliste“). Geräteübergreifend über denselben privaten Gist wie die
// Hauptapp (Token gh_gist_token, Datei maick-trading-system.json). Im Gist wird
// NUR watchlist + _meta.geloeschteWatchlist angefasst, alles andere (Trades,
// Depots …) unverändert zurückgeschrieben. Kein POST an /data - das erledigt
// die Hauptapp beim nächsten Öffnen über ihren normalen Abgleich.
const MTS_KEY = 'mts_v2';
const GIST_DATEI = 'maick-trading-system.json';
let FOKUS = [];            // zusammengeführte Sicht aus lokal + Gist
let FOKUS_SYNC = '';       // Hinweiszeile unter der Liste

function gistToken() {
  try { return localStorage.getItem('mts_gist_token') || localStorage.getItem('gh_gist_token') || ''; } catch (e) { return ''; }
}
function ladeLokal() {
  try { return JSON.parse(localStorage.getItem(MTS_KEY) || 'null'); } catch (e) { return null; }
}

// Identische Kopie von _mtsMergeWatchlist aus "Maick's Trading System.html"
// (tests/test-trade-verwaltung.js prüft den Gleichlauf).
function _mtsMergeWatchlist(basis, andere) {
    const vermerke = { ...((andere && andere._meta && andere._meta.geloeschteWatchlist) || {}) };
    Object.entries((basis && basis._meta && basis._meta.geloeschteWatchlist) || {}).forEach(([t, ts]) => {
        vermerke[t] = Math.max(ts, vermerke[t] || 0);
    });
    const nachTicker = new Map();
    ((basis && basis.watchlist) || []).forEach(w => { if (w && w.ticker) nachTicker.set(w.ticker, w); });
    ((andere && andere.watchlist) || []).forEach(w => {
        if (!w || !w.ticker || !w.ts) return;   // Alt-Einträge ohne ts entscheidet die Basis
        const eigen = nachTicker.get(w.ticker);
        if (!eigen || w.ts > (eigen.ts || 0)) nachTicker.set(w.ticker, w);
    });
    const watchlist = [...nachTicker.values()]
        .filter(w => !(vermerke[w.ticker] >= (w.ts || 0)))
        .sort((x, y) => (y.ts || 0) - (x.ts || 0));
    return { watchlist, vermerke };
}

async function gistHolen(token) {
  let id = '';
  try { id = localStorage.getItem('mts_gist_id') || ''; } catch (e) {}
  const kopf = { headers: { 'Authorization': `token ${token}` }, cache: 'no-store' };
  if (!id) {
    const r = await fetch('https://api.github.com/gists?per_page=100', kopf);
    if (!r.ok) throw new Error('Gist-Liste HTTP ' + r.status);
    const g = (await r.json()).find(x => x.files && x.files[GIST_DATEI]);
    if (!g) return null;
    id = g.id;
    try { localStorage.setItem('mts_gist_id', id); } catch (e) {}
  }
  const r = await fetch(`https://api.github.com/gists/${id}`, kopf);
  if (!r.ok) throw new Error('Gist HTTP ' + r.status);
  const datei = (await r.json()).files?.[GIST_DATEI];
  if (!datei || datei.truncated || !datei.content) return null;   // unvollständig → nie zurückschreiben
  const huelle = JSON.parse(datei.content);
  const daten = huelle && huelle.data ? huelle.data : huelle;
  if (!daten || !Array.isArray(daten.trades)) return null;
  return { id, huelle, daten };
}

async function gistSchreiben(token, g) {
  const content = JSON.stringify(g.huelle && g.huelle.data ? { ...g.huelle, data: g.daten } : g.daten, null, 2);
  const r = await fetch(`https://api.github.com/gists/${g.id}`, {
    method: 'PATCH',
    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { [GIST_DATEI]: { content } } })
  });
  if (!r.ok) throw new Error('Gist speichern HTTP ' + r.status);
}

// Wendet dieselbe Änderung auf den lokalen Stand und den Gist an. Beide
// Seiten bekommen dasselbe ts - die Hauptapp führt sie pro Ticker zusammen.
async function aendereFokusliste(aenderung) {
  const jetzt = Date.now();
  const anwenden = d => {
    d.watchlist = Array.isArray(d.watchlist) ? d.watchlist : [];
    d._meta = d._meta || {};
    d._meta.geloeschteWatchlist = d._meta.geloeschteWatchlist || {};
    d.watchlist = aenderung(d.watchlist, d._meta.geloeschteWatchlist, jetzt);
  };
  const token = gistToken();
  let lokal = ladeLokal();
  if (!lokal && !token) lokal = { watchlist: [], _meta: { watchlistImported: true } };
  if (lokal) {
    anwenden(lokal);
    try { localStorage.setItem(MTS_KEY, JSON.stringify(lokal)); } catch (e) {}
  }
  let remote = null, fehler = '';
  if (token) {
    try {
      const g = await gistHolen(token);
      if (g) { anwenden(g.daten); await gistSchreiben(token, g); remote = g.daten; }
      else fehler = 'kein vollständiger Hauptapp-Gist gefunden';
    } catch (e) { fehler = e.message; }
  }
  FOKUS = _mtsMergeWatchlist(lokal || remote || {}, remote || {}).watchlist;
  FOKUS_SYNC = !token ? 'Nur auf diesem Gerät gespeichert — für andere Geräte in der Hauptapp den Gist-Token (☁ Cloud-Sync) einrichten.'
    : fehler ? 'Cloud-Sync fehlgeschlagen (' + fehler + ') — vorerst nur auf diesem Gerät.'
    : 'Geräteübergreifend gespeichert.';
  renderBeobachtet();
  return { cloud: !!remote, fehler };
}

async function ladeFokusliste() {
  const lokal = ladeLokal();
  FOKUS = (lokal && Array.isArray(lokal.watchlist)) ? lokal.watchlist.slice() : [];
  renderBeobachtet();
  const token = gistToken();
  if (!token) { FOKUS_SYNC = 'Nur dieses Gerät — ohne Gist-Token keine Einträge von anderen Geräten.'; renderBeobachtet(); return; }
  try {
    const g = await gistHolen(token);
    if (!g) return;
    FOKUS = _mtsMergeWatchlist(lokal || g.daten, g.daten).watchlist;
    FOKUS_SYNC = '';
  } catch (e) { FOKUS_SYNC = 'Cloud-Stand nicht erreichbar (' + e.message + ') — zeigt nur dieses Gerät.'; }
  renderBeobachtet();
}

function aufFokusliste(ticker) { return FOKUS.some(w => w.ticker === ticker); }

function setupZu(ticker) {
  return ((window.TOP_SETUPS && window.TOP_SETUPS.setups) || []).find(x => x.ticker === ticker) || null;
}

function renderBeobachtet() {
  const el = document.getElementById('beobachtet');
  if (!el) return;
  const offen = (() => { try { return localStorage.getItem('kaufReviewBeobachtetZu') !== '1'; } catch (e) { return true; } })();
  const zeilen = FOKUS.map(w => {
    const s = setupZu(w.ticker);
    const pivot = (s && s.pivot > 0) ? s.pivot : w.pivot;
    const stop = (s && s.stop > 0) ? s.stop : w.stop;
    const teile = [];
    if (s && s.preis != null) teile.push(`Kurs ${s.preis}`);
    if (pivot > 0) teile.push(`Pivot ${pivot}`);
    if (stop > 0) teile.push(`Stop ${stop}`);
    if (s && s.preis != null && pivot > 0) {
      const d = (s.preis - pivot) / pivot * 100;
      teile.push(d >= 0 ? `<span class="an">▲ ${d.toFixed(1)}% über Pivot</span>` : `${d.toFixed(1)}% bis Pivot`);
    }
    if (s && s.pivot_status) teile.push(s.pivot_status === 'BREAKOUT' ? '🚀 BREAKOUT' : '🎯 ARMED');
    if (s && gesperrt(s)) teile.push(`<span class="warn">Earnings in ${s.earnings_tage} T</span>`);
    if (s && s.regime && s.regime !== 'gruen') teile.push(`<span class="warn">Markt ${s.regime}</span>`);
    if (!s) teile.push('heute kein Top-Setup');
    if (w.date) teile.push('seit ' + w.date);
    const kauf = `../Maick's Trading System.html?neuerTrade=${enc(w.ticker)}&quelle=Kauf-Review-Fokusliste`
      + (pivot > 0 ? `&entry=${enc(pivot)}` : '') + (stop > 0 ? `&stop=${enc(stop)}` : '');
    return `<div class="wl-row">
      <div class="wl-main">
        <div class="wl-tk">${w.ticker}<span class="nm">${w.name || (s && s.name) || ''}</span></div>
        <div class="wl-sub">${teile.join(' · ')}</div>
      </div>
      <a href="setup-detail.html?ticker=${enc(w.ticker)}"${IST_STANDALONE_PWA ? '' : ' target="_blank" rel="noopener"'} title="Vollständige Analyse">🔍</a>
      <a href="${kauf}" title="In den Trade-Planner der Hauptapp">🛒</a>
      <button type="button" data-t="${w.ticker}" onclick="entferneBeobachtet(this.dataset.t)" title="Von der Fokusliste nehmen">✕</button>
    </div>`;
  }).join('');
  el.innerHTML = `<details class="wl"${offen ? ' open' : ''} ontoggle="try{localStorage.setItem('kaufReviewBeobachtetZu', this.open ? '' : '1')}catch(e){}">
    <summary>👀 Beobachtet (${FOKUS.length})<span class="hint">= Fokusliste der Hauptapp</span></summary>
    ${zeilen || '<div class="wl-empty">Noch nichts beobachtet — „👀 Beobachten“ unten setzt einen Wert hierher.</div>'}
    ${FOKUS_SYNC ? `<div class="wl-sync">${FOKUS_SYNC}</div>` : ''}
  </details>`;
}

async function entferneBeobachtet(ticker) {
  if (!confirm(`${ticker} von der Fokusliste nehmen? (Auch in der Hauptapp und auf anderen Geräten.)`)) return;
  await aendereFokusliste((wl, vermerke, jetzt) => { vermerke[ticker] = jetzt; return wl.filter(w => w.ticker !== ticker); });
  zeigeToast(`${ticker} von der Fokusliste genommen`);
}

function zeigeToast(text) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = text;
  t.classList.add('an');
  clearTimeout(t._z);
  t._z = setTimeout(() => t.classList.remove('an'), 2600);
}

function sessionKey() { return 'kaufReviewSession_' + ((window.TOP_SETUPS && window.TOP_SETUPS.erstellt) || ''); }

function speichereSession() {
  try { sessionStorage.setItem(sessionKey(), JSON.stringify({ idx, entscheidungen })); } catch (e) {}
}

function init() {
  const d = window.TOP_SETUPS;
  ladeFokusliste();
  if (ladefehler || !d || !Array.isArray(d.setups) || !d.setups.length) { zeigeLeer(); return; }
  QUEUE = d.setups.filter(aktivBar);
  GATED_COUNT = d.setups.length - QUEUE.length;
  if (!QUEUE.length) { zeigeLeer(true); return; }
  try {
    const saved = JSON.parse(sessionStorage.getItem(sessionKey()) || 'null');
    if (saved) { idx = saved.idx || 0; entscheidungen = saved.entscheidungen || {}; }
  } catch (e) {}
  document.getElementById('actionbar').style.display = 'flex';
  ladeRotationLeaderMap();
  render();
}

function zeigeLeer(gatedOnly) {
  document.getElementById('main').innerHTML = `<div id="empty">
    <b>${ladefehler ? 'Top-Setups konnten nicht geladen werden.' : gatedOnly
        ? 'Aktuell kein aktives Top-Setup.' : 'Aktuell keine Top-Setups.'}</b>
    <div class="sub">${ladefehler
        ? 'Diese Seite braucht data/top_setups.js - existiert erst nach dem ersten Pipeline-Lauf.'
        : gatedOnly
        ? `${GATED_COUNT} Setup(s) sind aktuell wegen Marktregime oder Earnings-Fenster gesperrt - siehe <a href="index.html">Signal Hub</a> für Details.`
        : 'Schau später nochmal vorbei oder stoß im Signal Hub einen Cloud-Scan an.'}</div>
  </div>`;
}

function flagge(m) { return m === 'USA' ? '🇺🇸' : m === 'Europa' ? '🇪🇺' : '🏳️'; }

function renderRegimeBanner(regime) {
  const chips = Object.entries(regime || {}).map(([markt, r]) => {
    const icon = r.ampel === 'gruen' ? '🟢' : r.ampel === 'gelb' ? '🟡' : '🔴';
    return `<span class="regime-chip ${r.ampel}">${icon} ${markt}: ${r.hinweis || r.ampel}</span>`;
  }).join('');
  return `<div class="regime-banner">${chips}</div>`;
}

function konfluenz(s) {
  const leaderInfo = ROTATION_LEADER_MAP && ROTATION_LEADER_MAP.get(s.ticker);
  const kriterien = [
    { ok: (s.quellen_unabhaengig || 0) >= 2, label: `${s.quellen_unabhaengig || 0} unabhängige externe Quellen` },
    { ok: !!leaderInfo, label: leaderInfo ? `Leader im Thema „${leaderInfo.theme}”` : 'Keine aktuelle Branchenführerschaft' },
  ];
  const score = kriterien.filter(k => k.ok).length;
  const title = kriterien.map(k => (k.ok ? '✓ ' : '– ') + k.label).join('\n');
  const cls = score >= 2 ? 'voll' : score >= 1 ? 'teil' : '';
  const leaderBadge = leaderInfo
    ? `<span class="badge b-leader" title="Leader im Thema „${leaderInfo.theme}” (RS ${leaderInfo.rs})">🔥 Leader</span>` : '';
  return `<span class="badge b-konfluenz ${cls}" title="${title}">🎯 ${score}/2</span>${leaderBadge}`;
}

function checklist(tt) {
  return Object.entries(TT_LABELS).map(([k, label]) => {
    const ampel = (tt && tt[k]) || 'na';
    const qCls = ampel === 'gruen' ? 'q-gruen' : ampel === 'rot' || !tt || !tt[k] ? 'q-na' : '';
    const dCls = ampel === 'gruen' ? 'd-gruen' : ampel === 'gelb' ? 'd-gelb' : ampel === 'rot' ? 'd-rot' : 'd-na';
    return `<div class="qs-item ${qCls}"><span class="dot ${dCls}"></span><span>${label}</span></div>`;
  }).join('');
}

function liesKapitalRisiko() {
  const kEl = document.getElementById('kr-kapital'), rEl = document.getElementById('kr-risiko');
  const kapital = kEl ? parseFloat(kEl.value) || 0 : 0;
  const risiko = rEl ? parseFloat(rEl.value) || 0 : 0;
  try {
    localStorage.setItem('kaufReviewKapital', kapital || '');
    localStorage.setItem('kaufReviewRisiko', risiko || '');
  } catch (e) {}
  return { kapital, risiko };
}

function berechneGroesse(s) {
  const { kapital, risiko } = liesKapitalRisiko();
  const entry = s.pivot, stop = s.stop;
  if (!(kapital > 0) || !(risiko > 0) || !(entry > 0) || !(stop > 0) || stop >= entry) return null;
  const stopAbstand = entry - stop;
  const stueck = Math.floor((kapital * risiko / 100) / stopAbstand);
  if (stueck <= 0) return null;
  return { stueck, positionswert: stueck * entry, risikoEUR: stueck * stopAbstand };
}

function renderSizeBox(s) {
  const g = berechneGroesse(s);
  if (!g) return `<div class="sizebox"><span class="empty">Kapital + Risiko-% oben eintragen für einen Stückzahl-Vorschlag.</span></div>`;
  return `<div class="sizebox">
    <div class="row"><span>Stückzahl (grob)</span><b>${g.stueck}</b></div>
    <div class="row"><span>Positionswert</span><b>${g.positionswert.toFixed(0)}</b></div>
    <div class="row"><span>Risiko bis Stop</span><b>${g.risikoEUR.toFixed(0)}</b></div>
  </div>`;
}

function render() {
  if (idx >= QUEUE.length) { renderSummary(); return; }
  const s = QUEUE[idx];
  document.getElementById('progress').textContent = `${idx + 1} / ${QUEUE.length}`;
  document.getElementById('progressfill').style.width = ((idx) / QUEUE.length * 100) + '%';

  const badge = s.pivot_status === 'BREAKOUT'
    ? '<span class="badge b-brk">🚀 BREAKOUT</span>' : '<span class="badge b-armed">🎯 ARMED</span>';
  const kern = s.kern_setup
    ? `<span class="badge b-kern" title="Forward-Backtest ${s.backtest ? s.backtest.win + '% Win-Rate bei ' + s.backtest.n + ' gereiften Picks' : ''}">⭐ Kern-Setup</span>` : '';
  const depot = s.im_depot
    ? '<span class="badge b-depot" title="Bereits offene Position im Depot">📌 im Depot</span>' : '';
  const beob = aufFokusliste(s.ticker)
    ? '<span class="badge b-watch" title="Steht auf der Fokusliste (👀 Beobachtet oben)">👀 beobachtet</span>' : '';
  const distPct = (s.pivot > 0 && s.preis != null) ? ((s.preis - s.pivot) / s.pivot * 100) : null;

  document.getElementById('main').innerHTML = `
    ${window.TOP_SETUPS.marktregime ? renderRegimeBanner(window.TOP_SETUPS.marktregime) : ''}
    <div class="krbar">
      <div class="presets">${KAPITAL_PRESETS.map(v =>
        `<button type="button" data-kapital="${v}" onclick="setzeKapital(${v})">${v.toLocaleString('de-DE')} €</button>`).join('')}</div>
      <label>Kapital <input type="number" id="kr-kapital" inputmode="decimal" placeholder="z.B. 20000" oninput="aktualisiereGroesse()"></label>
      <label>Risiko % <input type="number" id="kr-risiko" inputmode="decimal" step="0.25" placeholder="1.25" oninput="aktualisiereGroesse()"></label>
      <div class="note">Grobe Schätzung ohne Exposure-Deckel/Portfolio-Limits — die Hauptapp rechnet beim Speichern verbindlich nach.</div>
    </div>
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-tk">${s.ticker} ${flagge(s.markt)}</div>
          <div class="card-nm">${s.name || ''}</div>
        </div>
        <div class="card-px">${s.preis != null ? s.preis : '—'}<div class="sub">aktueller Kurs</div></div>
      </div>
      <div class="badges">${beob}${kern}${depot}${badge}${konfluenz(s)}</div>
      <div class="pivotline">
        <div>Pivot<b>${s.pivot != null ? s.pivot : '—'}</b></div>
        <div>Stop<b>${s.stop != null ? s.stop : '—'}</b></div>
        <div>Abstand<b>${distPct != null ? (distPct >= 0 ? '+' : '') + distPct.toFixed(1) + '%' : '—'}</b></div>
      </div>
      <div>
        <h2 class="tt-head">Trend-Template</h2>
        <div class="quickscan">${checklist(s.trend_template)}</div>
      </div>
      ${s.backtest ? `<div class="backtest-note">Forward-Backtest ${s.pivot_status} (${s.backtest.horizont}): <b>${s.backtest.win}%</b> Win-Rate bei ${s.backtest.n} gereiften Picks</div>` : ''}
      ${renderSizeBox(s)}
      <div class="detail-link"><a href="setup-detail.html?ticker=${enc(s.ticker)}"${IST_STANDALONE_PWA ? '' : ' target="_blank" rel="noopener"'}>🔍 Vollständige Analyse ansehen</a></div>
    </div>
  `;
  // Kapital/Risiko aus localStorage wiederherstellen (persistiert über Sessions,
  // anders als idx/entscheidungen die pro Review-Durchgang neu sind).
  try {
    const kEl = document.getElementById('kr-kapital'), rEl = document.getElementById('kr-risiko');
    if (kEl && !kEl.value) kEl.value = localStorage.getItem('kaufReviewKapital') || '';
    if (rEl && !rEl.value) rEl.value = localStorage.getItem('kaufReviewRisiko') || '1.25';
  } catch (e) {}
  aktualisiereGroesse();
  autoFillKapital();
}

// Nur den Stückzahl-Kasten neu zeichnen, NICHT die ganze Karte: render()
// ersetzt per innerHTML auch die Eingabefelder, dadurch verlor das
// Kapital-Feld bei jedem Tastendruck den Cursor.
function aktualisiereGroesse() {
  const box = document.querySelector('#main .sizebox');
  if (box && idx < QUEUE.length) box.outerHTML = renderSizeBox(QUEUE[idx]);
  const k = parseFloat((document.getElementById('kr-kapital') || {}).value) || 0;
  document.querySelectorAll('.krbar .presets button').forEach(b =>
    b.classList.toggle('aktiv', Number(b.dataset.kapital) === k));
}

function setzeKapital(v) {
  const el = document.getElementById('kr-kapital');
  if (!el) return;
  el.value = v;
  aktualisiereGroesse();
}

// Best-effort Depotwert-Summe vom lokalen 8090-Server (nur wenn same-origin
// erreichbar, z.B. Mac mini/Tailscale) - scheitert auf reiner Pages-Version
// still, dann bleibt Kapital manuell einzutragen. Ueberschreibt nie einen
// bereits gesetzten Wert.
async function autoFillKapital() {
  const el = document.getElementById('kr-kapital');
  if (!el || el.value) return;
  try {
    const r = await fetch('/data', { signal: AbortSignal.timeout(2500) });
    if (!r.ok) return;
    const d = await r.json();
    const summe = (d.depots || []).reduce((sum, dep) => sum + (Number(dep.depotwert) || 0), 0);
    if (summe > 0 && el && !el.value) { el.value = Math.round(summe); aktualisiereGroesse(); }
  } catch (e) {}
}

function entscheiden(status) {
  const s = QUEUE[idx];
  entscheidungen[s.ticker] = status;
  idx++;
  speichereSession();
  render();
  if (status === 'beobachten') beobachte(s);
}

async function beobachte(s) {
  const eintrag = { ticker: s.ticker, name: s.name || '', quelle: 'Kauf-Review',
                    pivot: s.pivot > 0 ? s.pivot : null, stop: s.stop > 0 ? s.stop : null,
                    date: new Date().toLocaleDateString('de-DE') };
  const r = await aendereFokusliste((wl, vermerke, jetzt) => {
    const alt = wl.find(w => w.ticker === s.ticker) || {};
    delete vermerke[s.ticker];
    return [{ ...alt, ...eintrag, ts: jetzt }, ...wl.filter(w => w.ticker !== s.ticker)];
  });
  zeigeToast(`👀 ${s.ticker} auf der Fokusliste` + (r.cloud ? ' ✓ alle Geräte' : ' (nur dieses Gerät)'));
}

function kaufen() {
  const s = QUEUE[idx];
  entscheidungen[s.ticker] = 'gekauft';
  speichereSession();
  const href = `../Maick's Trading System.html?neuerTrade=${enc(s.ticker)}&quelle=Kauf-Review-Queue`
    + (s.pivot > 0 ? `&entry=${enc(s.pivot)}` : '') + (s.stop > 0 ? `&stop=${enc(s.stop)}` : '');
  location.href = href;
}

function renderSummary() {
  document.getElementById('progress').textContent = `${QUEUE.length} / ${QUEUE.length}`;
  document.getElementById('progressfill').style.width = '100%';
  document.getElementById('actionbar').style.display = 'none';
  const werte = Object.values(entscheidungen);
  const count = st => werte.filter(v => v === st).length;
  document.getElementById('main').innerHTML = `
    <div class="summary">
      <h2>✅ Durchgesehen</h2>
      <div>Alle ${QUEUE.length} aktiven Top-Setups sind durch.${GATED_COUNT ? ` (${GATED_COUNT} weitere aktuell gesperrt)` : ''}</div>
      <div class="stats">
        <div class="stat"><b>${count('gekauft')}</b><span>Gekauft</span></div>
        <div class="stat"><b>${count('beobachten')}</b><span>Beobachten</span></div>
        <div class="stat"><b>${count('verworfen')}</b><span>Verworfen</span></div>
      </div>
      <button onclick="neuStarten()">🔄 Von vorn</button>
    </div>
  `;
}

function neuStarten() {
  idx = 0; entscheidungen = {};
  speichereSession();
  document.getElementById('actionbar').style.display = 'flex';
  render();
}

init();
</script>
</body>
</html>
