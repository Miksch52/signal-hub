name: Signal-Hub Cloud-Pipeline

# Ersetzt den fruehen Mac-mini-LaunchAgent (com.maick.signalhub) UND das
# frühere signal-hub.yml im Repo Miksch52/maick-trading-system. Ausgelagert
# in dieses eigene, oeffentliche Repo (2026-07-28), weil GitHub-Actions-
# Minuten fuer private Repos kontoweit gedeckelt sind (2.000 Min/Monat) und
# genau dieser Lauf (4x/Tag + haeufige manuelle Cloud-Trigger) den groessten
# Teil davon verbraucht hat. Oeffentliche Repos haben unbegrenzte Minuten.
# maick-trading-system bleibt bewusst PRIVAT (enthaelt echte Depotdaten in
# der Historie) - siehe dessen deploy.yml, das von hier am Laufende
# angestossen wird.
#
# Vier Slots/Tag (07:30 / 15:00 / 17:00 / 21:30 Europe/Berlin) - je zwei
# Cron-Zeilen pro Slot fuer CET/CEST. run.py --scheduled entscheidet selbst
# (ueber TZ=Europe/Berlin + persistiertem state.json aus R2), welcher der
# acht taeglichen Anstoesse tatsaechlich den Lauf ausloest.
on:
  schedule:
    - cron: '30 5 * * *'   # 07:30 Europe/Berlin (CEST, Sommer)
    - cron: '30 6 * * *'   # 07:30 Europe/Berlin (CET, Winter)
    - cron: '0 13 * * *'   # 15:00 Europe/Berlin (CEST, Sommer)
    - cron: '0 14 * * *'   # 15:00 Europe/Berlin (CET, Winter)
    - cron: '0 15 * * *'   # 17:00 Europe/Berlin (CEST, Sommer)
    - cron: '0 16 * * *'   # 17:00 Europe/Berlin (CET, Winter)
    - cron: '30 19 * * *'  # 21:30 Europe/Berlin (CEST, Sommer)
    - cron: '30 20 * * *'  # 21:30 Europe/Berlin (CET, Winter)
  workflow_dispatch: {}    # manueller Testlauf / Cloud-Trigger-Button

env:
  TZ: Europe/Berlin

# Vier Jobs statt (bis 2026-08-09) ein einzelner Job mit sechs Schritten in
# Kette. Grund: Price-Action-Hub und Rotation-Dashboard haben KEINE echte
# Abhaengigkeit voneinander (Rotation-Dashboard liest nur Signal-Hubs
# signals.json als Gate + die schon vorher aus R2 gezogene Markets-360-CSV,
# siehe Rotation-Dashboard/src/pfade.py - niemals Price-Action-Hub-Output).
# Die einzige echte Kante ist Signal-Hub -> {Price-Action-Hub,
# Rotation-Dashboard}. Beide haengen nur an Signal-Hub, nicht aneinander,
# liefen bisher aber trotzdem nacheinander. Jetzt: fan-out nach Signal-Hub,
# beide parallel, convergieren im deploy-Job (Diamant-Muster) - kuerzere
# Laufzeit, weniger GitHub-Actions-Minuten (die schon einmal das Kontingent
# gesprengt haben, siehe Cloud-Pipeline-Ausfall 2026-08).
jobs:
  signal-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Signal-Hub
    steps:
      - uses: actions/checkout@v4
        with:
          path: Signal-Hub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhaengigkeiten installieren
        run: python3 -m pip install --quiet pypdf certifi

      # DNS-Workaround (seit 2026-07-30, verschaerft 2026-07-30 nach erneutem
      # Fehlschlag): der ubuntu-24.04-Runner scheitert wiederholt (aber nur
      # INTERMITTIEREND - mal geht ein Schritt durch, der naechste haengt) mit
      # "dial tcp: lookup ... on 127.0.0.53:53: server misbehaving" beim
      # R2-Zugriff. 127.0.0.53 ist der lokale systemd-resolved-Stub - erste
      # Version dieses Fixes hat nur dessen Upstream-DNS umgestellt, der Stub
      # selbst scheint aber gelegentlich SERVFAIL zu liefern, egal welcher
      # Upstream konfiguriert ist. Kein R2-/Kontingent-/Zugangsdaten-Problem
      # (das waere ein 401/403, kein DNS-Fehler), sondern ein Runner-Image-Bug.
      # Jetzt: /etc/resolv.conf direkt ueberschreiben (Stub komplett umgehen,
      # nicht nur dessen Upstream aendern) + rclone robuster gegen einzelne
      # DNS-Aussetzer machen (mehr/schnellere Retries statt 3x im ~4-Min-Abstand).
      - name: DNS-Workaround fuer GitHub-Runner (systemd-resolved "server misbehaving")
        run: |
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\n' \
            | sudo tee /etc/resolv.conf
          cat /etc/resolv.conf
          getent hosts r2.cloudflarestorage.com || true

      - name: rclone installieren (kein Paketmanager auf Runner noetig)
        run: |
          curl -sSL -o /tmp/rclone.zip "https://downloads.rclone.org/rclone-current-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone --version | head -1

      - name: R2-Remote konfigurieren
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          CONF

      # pivot_state.json (seit 2026-08-09): pivot_screener.py's Anti-Spam-
      # Zustand fuer "neu ARMED/BREAKOUT"-Pushes (siehe pivot_screener.py::
      # neuzugaenge) - ohne diese Zeile waere er bei jedem Cloud-Lauf leer
      # (frische VM), jeder aktuell ARMED/BREAKOUT-Ticker wuerde dann bei
      # JEDEM Lauf erneut als "neu" gelten statt nur beim echten Uebergang.
      #
      # logbuch.json/pivot_logbuch.json/pivot_eval_state.json (seit
      # 2026-08-16): die Forward-Logbuecher hinter score_backtest.py/
      # score_faktoren_backtest.py/pivot_backtest.py. Bis dahin wuchsen sie
      # NUR auf dem Mac mini (siehe src/pfade.py::LOKAL-Docstring) - ein
      # frischer Runner hatte nie den bisherigen Stand und verwarf seine
      # taeglichen --log-Eintraege wieder, ohne dass score_backtest.py/
      # score_faktoren_backtest.py je etwas auswerten konnten (leeres
      # LOGBUCH -> "if not lb: return", keine Datei geschrieben). R2 (_state/)
      # ist jetzt die gemeinsame Quelle fuer Cloud UND Mac mini/MacBook
      # (dort per scripts/sync_logbuch_pull.sh|push.sh, siehe run.py::
      # sync_logbuch_lokal()) - beide Seiten ziehen vor dem Lauf und schreiben
      # danach zurueck, damit die unverzerrte Stichprobe geraeteunabhaengig
      # waechst. regime_logbuch.json (seit 2026-08-21, regime_backtest.py)
      # bekommt von Anfang an dieselbe R2-Sicherung statt erst nachtraeglich
      # retrofittet zu werden wie die drei Dateien oben.
      - name: Zustand (state.json, pivot_state.json, Forward-Logbuecher) aus R2 wiederherstellen
        run: |
          mkdir -p ~/"Library/Application Support/SignalHub"
          rclone copy r2:signalhub-magazine/_state/state.json ~/"Library/Application Support/SignalHub/" || true
          rclone copy r2:signalhub-magazine/_state/pivot_state.json ~/"Library/Application Support/SignalHub/" || true
          rclone copy r2:signalhub-magazine/_state/logbuch.json ~/"Library/Application Support/SignalHub/" || true
          rclone copy r2:signalhub-magazine/_state/pivot_logbuch.json ~/"Library/Application Support/SignalHub/" || true
          rclone copy r2:signalhub-magazine/_state/pivot_eval_state.json ~/"Library/Application Support/SignalHub/" || true
          rclone copy r2:signalhub-magazine/_state/regime_logbuch.json ~/"Library/Application Support/SignalHub/" || true
          rclone copy r2:signalhub-magazine/_state/quellen_historie.json ~/"Library/Application Support/SignalHub/" || true
          rclone copy r2:signalhub-magazine/_state/quellen_watchdog_state.json ~/"Library/Application Support/SignalHub/" || true

      # pivot_backtest.json (seit 2026-08-23): den ZULETZT deployten Stand als
      # Basis in data/ zurueckholen, bevor run.py laeuft.
      #
      # Warum: pivot_backtest.py --evaluate merged seine frischen Forward-Zahlen
      # in die bestehende Datei (siehe main(): "bestand" wird geladen und nur um
      # forward_realisiert/-einzelfaelle/-stand ergaenzt). Auf einem frischen
      # Runner gibt es diese Datei nicht -> ohne diesen Restore wuerde --evaluate
      # eine Datei OHNE den RETRO-Block (ergebnis/n_charts/bias_hinweis)
      # schreiben und damit den Backtest-Report auf der Live-Seite kaputtmachen.
      # Der RETRO-Lauf selbst bleibt bewusst woechentlich und lokal
      # (scripts/weekly_backtest_upload.sh) - er ist der teure, ohnehin
      # Bias-behaftete Teil; der Forward-Test ist der, der taeglich reifen muss.
      #
      # Quelle ist _deploy/signal-hub/ (dorthin laedt der deploy-Job dieses
      # Workflows die Ausgaben, und dorthin laedt auch der woechentliche lokale
      # Lauf per scripts/upload_to_r2.sh) - also derselbe Stand, den die
      # Live-Seite gerade zeigt. "|| true": fehlt die Datei (ganz frisches
      # Setup), laeuft die Pipeline normal weiter.
      - name: Letzten pivot_backtest-Stand aus R2 holen (Basis fuer --evaluate)
        run: |
          mkdir -p data
          rclone copy r2:signalhub-magazine/_deploy/signal-hub/pivot_backtest.json data/ || true

      - name: Magazine aus R2 laden
        run: |
          mkdir -p _magazine
          rclone copy r2:signalhub-magazine/ _magazine/ --exclude "_state/**" --exclude "_test/**" --exclude "_deploy/**"

      - name: config.json aus Secret schreiben
        # env-Indirektion statt direkter ${{ }}-Interpolation in den Shell-String:
        # ein Apostroph im Secret-Inhalt (z.B. in einem Hinweistext wie "O'Neil-IBD"
        # in config.json, seit 2026-08-15) schliesst sonst das umgebende '...' der
        # Shell vorzeitig und bricht den Lauf mit "syntax error near unexpected
        # token" - passiert bei jeder direkten String-Interpolation eines Secrets
        # in einen Shell-Befehl, unabhaengig vom konkreten Sonderzeichen. printf
        # '%s' "$VAR" ist dagegen unempfindlich gegen jeden Zeicheninhalt.
        env:
          SIGNALHUB_CONFIG_JSON: ${{ secrets.SIGNALHUB_CONFIG_JSON }}
        run: printf '%s' "$SIGNALHUB_CONFIG_JSON" > config.json

      - name: "Pipeline laufen lassen (Cron: nur faellige Slots pushen, manueller Trigger: sofort ohne Push)"
        env:
          SIGNALHUB_IMAP_PASSWORD: ${{ secrets.SIGNALHUB_IMAP_PASSWORD }}
          SIGNALHUB_DEPOT_NAMEN: ${{ secrets.SIGNALHUB_DEPOT_NAMEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 src/run.py
          else
            python3 src/run.py --scheduled
          fi

      # War frueher der letzte Schritt im Gesamtjob (if: always(), damit ein
      # Fehler in einem SPAETEREN Schritt - z.B. Price-Action-Hub-Pipeline -
      # die Sicherung nicht verhindert). Jetzt genuegt if: always() alleine
      # innerhalb DIESES Jobs (schuetzt nur noch vor einem Absturz des
      # "Pipeline laufen lassen"-Schritts selbst) - Price-Action-Hub und
      # Rotation-Dashboard laufen jetzt in eigenen Jobs und koennen diesen
      # Schritt hier gar nicht mehr beeinflussen.
      - name: Zustand (state.json, pivot_state.json, Forward-Logbuecher) nach R2 sichern
        if: always()
        run: |
          rclone copy ~/"Library/Application Support/SignalHub/state.json" r2:signalhub-magazine/_state/
          rclone copy ~/"Library/Application Support/SignalHub/pivot_state.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/SignalHub/logbuch.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/SignalHub/pivot_logbuch.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/SignalHub/pivot_eval_state.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/SignalHub/regime_logbuch.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/SignalHub/quellen_historie.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/SignalHub/quellen_watchdog_state.json" r2:signalhub-magazine/_state/ || true

      # Taeglicher OHLC-Snapshot (seit 2026-08-20, Top-Setups-Roadmap Punkt 4,
      # siehe src/ohlc_history.py): anders als der Yahoo-Tages-Cache oben
      # (LOKAL, wird hier nie gesichert) landet diese Datei dauerhaft in R2 -
      # jeder Tag eine eigene, kleine Datei statt eines Zustands, der
      # ueberschrieben wird. "|| true": kein faelliger Slot -> keine Datei ->
      # kein Fehler.
      - name: OHLC-Tagessnapshot nach R2 sichern (persistente Kurshistorie)
        if: always()
        run: |
          rclone copy data/ohlc-history/ r2:signalhub-magazine/ohlc-history/ || true

      # Platzhalter, falls kein faelliger Slot lief (data/ existiert dann gar
      # nicht - run.py kehrt vor dem ersten os.makedirs(DATA) zurueck, siehe
      # src/run.py::main). Ohne Platzhalter haette upload-artifact nichts zum
      # Hochladen und wuerde KEIN Artifact anlegen - der Download in den
      # beiden Folge-Jobs wuerde dann bei jedem der taeglich vier NICHT
      # faelligen Cron-Anstoesse mit einem roten Fehler abbrechen, obwohl das
      # der normale, erwartete Fall ist (siehe "|| true"-Kommentar weiter
      # unten fuer dasselbe Problem beim R2-Upload).
      # WICHTIG (Bugfix 2026-08-09): Dateiname darf NICHT mit "." beginnen -
      # actions/upload-artifact@v4 ignoriert versteckte Dateien beim
      # Datei-Matching, ein Ordner mit nur einer Dotfile-Datei zaehlt als leer
      # ("No files were found ... No artifacts will be uploaded") und legt
      # dann GAR KEIN Artifact an, statt eines mit nur dem Platzhalter drin -
      # genau das Gegenteil vom beabsichtigten Zweck dieses Schritts. Fuehrte
      # dazu, dass price-action-hub/rotation-dashboard bei JEDEM Nicht-Slot-
      # Lauf mit "Artifact not found for name: signal-hub-data" abbrachen.
      - name: Platzhalter fuer Artifact-Upload sicherstellen (auch ohne faelligen Slot)
        run: mkdir -p data && touch data/ARTIFACT_KEEP

      - name: Signal-Hub-Ausgabe fuer Price-Action-Hub/Rotation-Dashboard bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: signal-hub-data
          path: Signal-Hub/data
          retention-days: 1

      - name: Markets-360-Magazinauszug fuer Rotation-Dashboard bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: signal-hub-magazine-markets360
          path: Signal-Hub/_magazine/markets360
          retention-days: 1

  price-action-hub:
    needs: signal-hub
    runs-on: ubuntu-latest
    steps:
      # Kein eigener Signal-Hub-Checkout noetig: Price-Action-Hub/src/pfade.py
      # erwartet die Signal-Hub-Ausgabe nur unter dem Geschwister-Ordner
      # "Signal-Hub/data/signals.json" (Fake-Edge-Test: echte Abhaengigkeit
      # ist die Datei, nicht der Signal-Hub-Code oder -Checkout). download-
      # artifact legt den Zielordner selbst an, ein Checkout waere hier nur
      # totes Gewicht.
      - name: Signal-Hub-Ausgabe herunterladen
        uses: actions/download-artifact@v4
        with:
          name: signal-hub-data
          path: Signal-Hub/data

      - name: Price-Action-Hub auschecken (Geschwister-Ordner, oeffentliches Repo, kein Token noetig)
        uses: actions/checkout@v4
        with:
          repository: Miksch52/price-action-hub
          path: Price-Action-Hub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ab hier fuer den Top-Setups-Push (top_setups.py, seit 2026-08-09):
      # braucht denselben ntfy-Kanal wie die drei anderen Push-Quellen sowie
      # einen R2-gesicherten Anti-Spam-Zustand (top_setups_state.json), sonst
      # waere er bei jedem frischen Runner leer und jedes aktuell gueltige
      # Top-Setup wuerde bei JEDEM Lauf erneut als "neu" gelten. Gleiches
      # Vorgehen wie im signal-hub-Job oben (DNS-Workaround/rclone/R2), hier
      # nur fuer diesen Job separat, da jeder Job auf einem frischen Runner
      # startet.
      - name: DNS-Workaround fuer GitHub-Runner (systemd-resolved "server misbehaving")
        run: |
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\n' \
            | sudo tee /etc/resolv.conf

      - name: rclone installieren (kein Paketmanager auf Runner noetig)
        run: |
          curl -sSL -o /tmp/rclone.zip "https://downloads.rclone.org/rclone-current-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone

      - name: R2-Remote konfigurieren
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          CONF

      # hebel_logbuch.json (seit 2026-08-16): Forward-Log der Hebel-Ampel
      # (hebel_backtest.py) - anders als bei top_setups_state.json gibt es
      # hier KEINEN lokalen Mac-mini-Lauf, der als Ausweichquelle einspringen
      # koennte (Price-Action-Hub hat keinen eigenen LaunchAgent) - ohne
      # diese Zeile waere das Logbuch bei JEDEM Cloud-Lauf leer und die
      # unverzerrte Stichprobe koennte nie ueber Kalenderzeit wachsen.
      # muster_logbuch.json (seit 2026-08-17): Forward-Log der Price-Action-
      # Muster (muster_backtest.py) - gleicher Grund/gleiches Muster wie
      # hebel_logbuch.json direkt darueber.
      - name: Zustand (top_setups_state.json, hebel_logbuch.json, muster_logbuch.json) aus R2 wiederherstellen
        run: |
          mkdir -p ~/"Library/Application Support/PriceActionHub"
          rclone copy r2:signalhub-magazine/_state/top_setups_state.json ~/"Library/Application Support/PriceActionHub/" || true
          rclone copy r2:signalhub-magazine/_state/hebel_logbuch.json ~/"Library/Application Support/PriceActionHub/" || true
          rclone copy r2:signalhub-magazine/_state/muster_logbuch.json ~/"Library/Application Support/PriceActionHub/" || true

      # NUR fuer den ntfy-Kanal (benachrichtigung.ntfy_thema/-server) gebraucht,
      # reiner Datei-Read in top_setups.py (siehe pfade.py::SIGNAL_HUB_CONFIG,
      # kein Cross-App-Python-Import). Landet NICHT in einem Artifact-Upload
      # dieses Jobs -> bleibt innerhalb des ephemeren Runners, wird nie
      # veroeffentlicht (das Repo hier ist oeffentlich).
      - name: Signal-Hub config.json aus Secret schreiben (ntfy-Zugangsdaten fuer Top-Setups-Push)
        # env-Indirektion statt direkter Interpolation - siehe Kommentar beim
        # ersten Vorkommen dieses Musters weiter oben in dieser Datei.
        env:
          SIGNALHUB_CONFIG_JSON: ${{ secrets.SIGNALHUB_CONFIG_JSON }}
        run: printf '%s' "$SIGNALHUB_CONFIG_JSON" > Signal-Hub/config.json

      - name: Price-Action-Hub Pipeline (nur wenn Signal-Hub in diesem Lauf frisch geschrieben hat)
        working-directory: Price-Action-Hub
        run: |
          if [ -f "../Signal-Hub/data/signals.json" ]; then
            python3 src/run.py
          else
            echo "Signal-Hub hat in diesem Lauf keine neuen Daten geschrieben (kein faelliger Slot) - uebersprungen."
          fi

      - name: Zustand (top_setups_state.json, hebel_logbuch.json, muster_logbuch.json) nach R2 sichern
        if: always()
        run: |
          rclone copy ~/"Library/Application Support/PriceActionHub/top_setups_state.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/PriceActionHub/hebel_logbuch.json" r2:signalhub-magazine/_state/ || true
          rclone copy ~/"Library/Application Support/PriceActionHub/muster_logbuch.json" r2:signalhub-magazine/_state/ || true

      - name: Platzhalter fuer Artifact-Upload sicherstellen (auch ohne faelligen Slot)
        run: mkdir -p Price-Action-Hub/data && touch Price-Action-Hub/data/ARTIFACT_KEEP

      - name: Price-Action-Hub-Ausgabe fuer den Deploy-Schritt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: price-action-hub-data
          path: Price-Action-Hub/data
          retention-days: 1

      # Sonderfall: top_setups.py (Teil von Price-Action-Hub, siehe
      # src/top_setups.py::OUT_JSON/OUT_JS) schreibt NICHT nach
      # Price-Action-Hub/data, sondern direkt nach Signal-Hub/data/
      # (liest signals.json + pivot.json + priceaction.json per JSON-Join
      # und legt das Ergebnis dorthin, wo die Startseite/Dashboard es laden).
      # Im alten Ein-Job-Design lief das automatisch mit (gleicher
      # Workspace); jetzt braucht es einen eigenen Artifact-Umweg zurueck in
      # den signal-hub-Datenordner des deploy-Jobs.
      - name: Platzhalter fuer Top-Setups-Artifact sicherstellen (auch ohne faelligen Slot)
        run: touch Signal-Hub/data/TOP_SETUPS_KEEP

      - name: Top-Setups-Aggregat fuer den Deploy-Schritt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: top-setups-data
          path: |
            Signal-Hub/data/top_setups.json
            Signal-Hub/data/top_setups.js
            Signal-Hub/data/TOP_SETUPS_KEEP
          retention-days: 1

  rotation-dashboard:
    needs: signal-hub
    runs-on: ubuntu-latest
    steps:
      # Gleiches Prinzip wie im price-action-hub-Job: nur die Ausgabedateien
      # von Signal-Hub werden gebraucht (signals.json als Gate, die
      # Markets-360-CSV aus dem Magazin), nicht der Signal-Hub-Code selbst -
      # download-artifact legt beide Zielordner selbst an, kein Checkout noetig.
      - name: Signal-Hub-Ausgabe herunterladen
        uses: actions/download-artifact@v4
        with:
          name: signal-hub-data
          path: Signal-Hub/data

      - name: Markets-360-Magazinauszug herunterladen
        uses: actions/download-artifact@v4
        with:
          name: signal-hub-magazine-markets360
          path: Signal-Hub/_magazine/markets360

      - name: Rotation-Dashboard auschecken (Geschwister-Ordner, oeffentliches Repo, kein Token noetig)
        uses: actions/checkout@v4
        with:
          repository: Miksch52/rotation-dashboard
          path: Rotation-Dashboard

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ab hier fuer rotation_logbuch.json (seit 2026-08-17, Forward-Log der
      # drei Setup-Kategorien, rotation_backtest.py): Rotation-Dashboard hat
      # wie Price-Action-Hub KEINEN eigenen LaunchAgent - ohne R2-Sicherung
      # waere das Logbuch bei JEDEM Cloud-Lauf leer und die unverzerrte
      # Stichprobe koennte nie ueber Kalenderzeit wachsen. Gleiches Vorgehen
      # wie im price-action-hub-Job oben (DNS-Workaround/rclone/R2), hier
      # nur fuer diesen Job separat, da jeder Job auf einem frischen Runner
      # startet.
      - name: DNS-Workaround fuer GitHub-Runner (systemd-resolved "server misbehaving")
        run: |
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\n' \
            | sudo tee /etc/resolv.conf

      - name: rclone installieren (kein Paketmanager auf Runner noetig)
        run: |
          curl -sSL -o /tmp/rclone.zip "https://downloads.rclone.org/rclone-current-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone

      - name: R2-Remote konfigurieren
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          CONF

      - name: Zustand (rotation_logbuch.json) aus R2 wiederherstellen
        run: |
          mkdir -p ~/"Library/Application Support/RotationDashboard"
          rclone copy r2:signalhub-magazine/_state/rotation_logbuch.json ~/"Library/Application Support/RotationDashboard/" || true

      - name: Rotation-Dashboard Pipeline (nur wenn Signal-Hub in diesem Lauf frisch geschrieben hat)
        working-directory: Rotation-Dashboard
        run: |
          if [ -f "../Signal-Hub/data/signals.json" ]; then
            python3 src/run.py
          else
            echo "Signal-Hub hat in diesem Lauf keine neuen Daten geschrieben (kein faelliger Slot) - uebersprungen."
          fi

      - name: Zustand (rotation_logbuch.json) nach R2 sichern
        if: always()
        run: rclone copy ~/"Library/Application Support/RotationDashboard/rotation_logbuch.json" r2:signalhub-magazine/_state/ || true

      - name: Platzhalter fuer Artifact-Upload sicherstellen (auch ohne faelligen Slot)
        run: mkdir -p Rotation-Dashboard/data && touch Rotation-Dashboard/data/ARTIFACT_KEEP

      - name: Rotation-Dashboard-Ausgabe fuer den Deploy-Schritt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: rotation-dashboard-data
          path: Rotation-Dashboard/data
          retention-days: 1

  # Convergence-Schritt des Diamanten: wartet auf alle drei Vorgaenger-Jobs
  # (Standard-Verhalten von "needs" - laeuft nur, wenn signal-hub UND
  # price-action-hub UND rotation-dashboard erfolgreich waren; genau wie
  # zuvor stoppt ein echter Fehler in "Pipeline laufen lassen" die gesamte
  # Kette, da dann price-action-hub/rotation-dashboard gar nicht erst starten).
  deploy:
    needs: [signal-hub, price-action-hub, rotation-dashboard]
    runs-on: ubuntu-latest
    steps:
      - name: Signal-Hub-Ausgabe herunterladen
        uses: actions/download-artifact@v4
        with:
          name: signal-hub-data
          path: data/signal-hub

      # Landet im selben Ordner wie oben (data/signal-hub) - top_setups.json/js
      # kommen zwar aus dem price-action-hub-Job, gehoeren inhaltlich aber zur
      # Signal-Hub-Ausgabe (siehe Kommentar im price-action-hub-Job oben).
      - name: Top-Setups-Aggregat herunterladen
        uses: actions/download-artifact@v4
        with:
          name: top-setups-data
          path: data/signal-hub

      - name: Price-Action-Hub-Ausgabe herunterladen
        uses: actions/download-artifact@v4
        with:
          name: price-action-hub-data
          path: data/price-action-hub

      - name: Rotation-Dashboard-Ausgabe herunterladen
        uses: actions/download-artifact@v4
        with:
          name: rotation-dashboard-data
          path: data/rotation-dashboard

      - name: DNS-Workaround fuer GitHub-Runner (systemd-resolved "server misbehaving")
        run: |
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\n' \
            | sudo tee /etc/resolv.conf
          cat /etc/resolv.conf
          getent hosts r2.cloudflarestorage.com || true

      - name: rclone installieren (kein Paketmanager auf Runner noetig)
        run: |
          curl -sSL -o /tmp/rclone.zip "https://downloads.rclone.org/rclone-current-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone --version | head -1

      - name: R2-Remote konfigurieren
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          CONF

      - name: Ausgabedateien nach R2 hochladen (fuer den Deploy-Workflow im Hauptrepo)
        # "|| true" pro Zeile noetig: bei uebersprungenen Slots enthalten die
        # Ordner nur den ARTIFACT_KEEP-Platzhalter - "[ -d ... ] && ..."
        # liefert trotzdem Erfolg, aber zur Sicherheit (und weil unter
        # "bash -e" jede fehlschlagende Zeile sofort den ganzen Schritt
        # abbricht) bleibt das Muster erhalten.
        # WICHTIG (Bugfix 2026-08-01): --include griff bisher nur "*.js" - die
        # echten .json-Dateien (signals.json, priceaction.json, rotation.json,
        # top_setups.json, ...) landeten NIE im Deploy. Die Cloud-Seite lief
        # trotzdem, weil jede App einen .js-Fallback (window.X_DATA) hat, aber
        # jeder direkte fetch("...json") bekam per SPA-Fallback die falsche
        # HTML-Seite zurueck (200, Content-Type text/html) statt echtem JSON -
        # unbemerkt, weil der Fallback den Fehler leise schluckt. Jetzt beide
        # Endungen deployen, damit fetch(...) wie im Code vorgesehen greift.
        run: |
          [ -d data/signal-hub ] && rclone copy data/signal-hub/ r2:signalhub-magazine/_deploy/signal-hub/ --include "*.js" --include "*.json" || true
          [ -d data/price-action-hub ] && rclone copy data/price-action-hub/ r2:signalhub-magazine/_deploy/price-action-hub/ --include "*.js" --include "*.json" || true
          [ -d data/rotation-dashboard ] && rclone copy data/rotation-dashboard/ r2:signalhub-magazine/_deploy/rotation-dashboard/ --include "*.js" --include "*.json" || true

      # Anti-Spam-Zustand fuer die Token-Ueberwachung (seit 2026-08-23) - gleiches
      # Muster wie pivot_eval_state.json/top_setups_state.json: ohne diesen
      # Zustand wuerde ein toter Token 4x taeglich pushen und die Warnung vor
      # einem bald ablaufenden Token 14 Tage lang ~56 Pushes erzeugen.
      - name: Token-Warnzustand aus R2 holen
        run: rclone copy r2:signalhub-magazine/_state/deploy_token_state.json ./ || true

      - name: Deploy im Hauptrepo (Miksch52/maick-trading-system) anstossen
        # Warum hier eine Ueberwachung haengt (seit 2026-08-23): am 2026-08-23
        # ist der DEPLOY_TRIGGER_TOKEN zwischen 14:11 und 15:19 abgelaufen. Alle
        # Datenjobs liefen weiter sauber durch, nur dieser letzte Schritt bekam
        # 401 - die Pipeline war rot, aber die Live-Seite wurde einfach nicht
        # mehr aktualisiert. Aufgefallen ist das rein zufaellig beim Nachsehen,
        # nicht durch eine Meldung. Genau das soll hier nicht wieder passieren:
        # der Fehler geht jetzt ueber denselben ntfy-Kanal raus wie die uebrigen
        # Push-Quellen, und ein bald ablaufender Token meldet sich VOR dem Ende.
        #
        # Deckt alle drei Repos ab: price-action-hub und rotation-dashboard
        # nutzen in ihren deploy-trigger.yml denselben Token-WERT, ein Ablauf
        # trifft also immer alle drei gleichzeitig.
        #
        # 404 wird wie 401/403 behandelt: ein fine-grained PAT ohne (noch)
        # gueltigen Zugriff auf das PRIVATE Hauptrepo bekommt von GitHub 404
        # statt 403 - dieselbe Sonderbehandlung wie in triggerCloudWorkflow()
        # im Frontend (siehe Wiki, Fix 2026-08-16).
        env:
          DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          SIGNALHUB_CONFIG_JSON: ${{ secrets.SIGNALHUB_CONFIG_JSON }}
        run: |
          set -uo pipefail
          STATE=deploy_token_state.json
          [ -f "$STATE" ] || echo '{}' > "$STATE"
          HEUTE=$(date -u +%F)

          # ntfy-Ziel aus derselben config.json wie alle anderen Push-Quellen -
          # reiner Datei-Read, kein Import (gleiches Muster wie top_setups.py).
          NTFY_THEMA=$(printf '%s' "$SIGNALHUB_CONFIG_JSON" | jq -r '.benachrichtigung.ntfy_thema // ""')
          NTFY_SERVER=$(printf '%s' "$SIGNALHUB_CONFIG_JSON" | jq -r '.benachrichtigung.ntfy_server // "https://ntfy.sh"')

          # alarm <schluessel> <titel> <text> <prio> - hoechstens einmal pro Tag
          # je Schluessel, damit ein Dauerzustand nicht zum Push-Dauerfeuer wird.
          alarm() {
            schluessel="$1"; titel="$2"; text="$3"; prio="${4:-default}"
            if [ -z "$NTFY_THEMA" ] || printf '%s' "$NTFY_THEMA" | grep -qi NOCH; then
              echo "  (kein ntfy-Thema konfiguriert -> kein Push)"; return 0
            fi
            letzter=$(jq -r --arg k "$schluessel" '.[$k] // ""' "$STATE")
            if [ "$letzter" = "$HEUTE" ]; then
              echo "  (heute schon gemeldet: $schluessel -> kein weiterer Push)"; return 0
            fi
            curl -sS -X POST "${NTFY_SERVER%/}/$NTFY_THEMA" \
              -H "Title: $titel" -H "Tags: key" -H "Priority: $prio" \
              -d "$text" >/dev/null && echo "  Push gesendet: $titel" \
              || echo "  ! ntfy-Versand fehlgeschlagen"
            jq --arg k "$schluessel" --arg d "$HEUTE" '.[$k]=$d' "$STATE" > "$STATE.tmp" && mv "$STATE.tmp" "$STATE"
          }

          CODE=$(curl -sS -o antwort.json -D kopfzeilen.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DEPLOY_TRIGGER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Miksch52/maick-trading-system/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP $CODE"

          case "$CODE" in
            401|403|404)
              alarm token_abgelehnt \
                "🔑 Deploy-Trigger-Token abgelehnt (HTTP $CODE)" \
                "Die Cloud-Pipeline laeuft, aber die Live-Seite wird NICHT mehr aktualisiert.
          Betrifft alle drei Repos (signal-hub, price-action-hub, rotation-dashboard) - gleicher Token-Wert.
          Fix: neuen fine-grained PAT anlegen (Actions: Read and write auf maick-trading-system) und als Secret DEPLOY_TRIGGER_TOKEN in allen drei Repos setzen.
          Bis dahin: Deploy von Hand anstossen mit
          gh workflow run deploy.yml --repo Miksch52/maick-trading-system --ref main" \
                urgent
              rclone copy "$STATE" r2:signalhub-magazine/_state/ || true
              exit 1 ;;
            2*) : ;;
            *)
              alarm token_fehler \
                "⚠️ Deploy-Trigger fehlgeschlagen (HTTP $CODE)" \
                "Kein Token-Problem, aber der Deploy im Hauptrepo wurde nicht angestossen. Antwort: $(head -c 300 antwort.json)" \
                high
              rclone copy "$STATE" r2:signalhub-magazine/_state/ || true
              exit 1 ;;
          esac

          # Vorwarnung: GitHub liefert bei PATs MIT Ablaufdatum den Header
          # "GitHub-Authentication-Token-Expiration". Fehlt er (OAuth-/App-Token
          # oder PAT ohne Ablauf), wird die Pruefung still uebersprungen - kein
          # Fehler, nur keine Vorwarnung moeglich.
          ABLAUF=$(grep -i '^github-authentication-token-expiration:' kopfzeilen.txt | sed 's/^[^:]*: *//' | tr -d '\r')
          if [ -n "$ABLAUF" ]; then
            ENDE=$(date -u -d "$ABLAUF" +%s 2>/dev/null || echo "")
            if [ -n "$ENDE" ]; then
              TAGE=$(( (ENDE - $(date -u +%s)) / 86400 ))
              echo "Token laeuft ab am $ABLAUF (noch $TAGE Tage)"
              if [ "$TAGE" -le 14 ]; then
                alarm token_laeuft_ab \
                  "🔑 Deploy-Token laeuft in $TAGE Tagen ab" \
                  "Ablauf: $ABLAUF
          Danach wird die Live-Seite nicht mehr automatisch aktualisiert (betrifft alle drei Repos).
          Rechtzeitig neuen fine-grained PAT anlegen und DEPLOY_TRIGGER_TOKEN in signal-hub, price-action-hub und rotation-dashboard neu setzen." \
                  high
              fi
            fi
          else
            echo "Kein Ablaufdatum im Antwort-Header -> keine Vorwarnung moeglich (OAuth-/App-Token oder PAT ohne Ablauf)."
          fi

          rclone copy "$STATE" r2:signalhub-magazine/_state/ || true
