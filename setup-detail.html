<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Setup-Analyse</title>
<style>
  /* ===================================================================
     Design "Tagesordnung" (seit 2026-08-09) - helle Papier-Basis mit
     weichen, schattierten Karten statt der fruehen dunklen Glas-Optik.
     Teal als einziger Marken-Akzent (--primary); Serif nur fuer das
     Story-Zitat (.story-quote), sonst durchgehend Sans/Mono - siehe
     wiki.html-Abschnitt zur Setup-Analyse fuer die Design-Herleitung.
     =================================================================== */
  :root{
    --primary:#1F6E66; --primary2:#1F6E66; --ok:#2E8B57; --warn:#C08A2E; --bad:#B23A2E;
    --bg:#F6F3EC; --bg2:#FFFFFF; --card:#FFFFFF; --line:#E2DED2; --line2:#EDEAE0;
    --txt:#1B241D; --muted:#6B7268; --muted2:#93998C; --teal-dim:rgba(31,110,102,.09);
    --shadow:0 1px 2px rgba(27,36,29,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--txt);line-height:1.45}
  a{color:var(--primary)}
  header{position:sticky;top:0;z-index:20;background:var(--bg2);
         border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(27,36,29,.04);
         padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  /* Touch-Ziele (seit 2026-08-20): min. 44x44px nach Apple-HIG, damit die
     Seite als mobiler Vor-Kauf-Check unterwegs auf dem iPhone zuverlässig
     bedienbar ist - vorher war die Tap-Fläche nur so hoch wie die Textzeile. */
  header a.back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap;
    display:inline-flex;align-items:center;min-height:44px;padding:0 4px 0 0}
  header a.back:hover{color:var(--txt)}
  header h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:120px}
  header .stand{font-size:11px;color:var(--muted2)}
  header input[type=search]{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:13px;color:var(--txt);width:150px;min-height:44px}
  header input[type=search]:focus{outline:2px solid var(--primary);outline-offset:1px}

  main{padding:18px 20px 60px;max-width:980px;margin:0 auto}
  #loading,#notfound{padding:60px 10px;text-align:center;color:var(--muted)}
  #notfound b{color:var(--txt)}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
        box-shadow:var(--shadow);
        display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:16px}
  .hero-id{flex:1;min-width:200px}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);margin-bottom:4px}
  .hero-tick{font-size:32px;font-weight:800;letter-spacing:.3px}
  .hero-name{font-size:14px;color:var(--muted);margin-top:2px}
  .hero-px{font-size:14px;margin-top:6px}
  .hero-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .scoregauge{text-align:center;min-width:90px}
  .scoregauge .num{font-size:34px;font-weight:800;line-height:1;color:var(--primary)}
  .scoregauge .lbl{font-size:11px;color:var(--muted2);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
  .tier{font-size:11px;padding:2px 9px;border-radius:20px;display:inline-block;margin-top:6px;font-weight:700}
  .tier-A{background:rgba(46,139,87,.12);color:var(--ok)}
  .tier-B{background:rgba(192,138,46,.14);color:var(--warn)}
  .tier-C{background:rgba(107,114,104,.12);color:var(--muted)}

  .badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;
         border:1px solid var(--line);color:var(--muted);background:var(--card)}
  .b-armed{background:rgba(192,138,46,.12);color:#8a611f;border-color:rgba(192,138,46,.4)}
  .b-brk{background:rgba(178,58,46,.12);color:var(--bad);border-color:rgba(178,58,46,.4)}
  .b-cheat{background:rgba(124,92,140,.12);color:#6b4f83;border-color:rgba(124,92,140,.4)}
  .b-watch{background:var(--line2);color:var(--muted)}
  .b-pa-bull{background:rgba(46,139,87,.12);color:var(--ok);border-color:rgba(46,139,87,.4)}
  .b-pa-bear{background:rgba(178,58,46,.12);color:var(--bad);border-color:rgba(178,58,46,.4)}
  .b-reg-gruen{background:rgba(46,139,87,.12);color:var(--ok);border-color:rgba(46,139,87,.4)}
  .b-reg-gelb{background:rgba(192,138,46,.14);color:var(--warn);border-color:rgba(192,138,46,.4)}
  .b-reg-rot{background:rgba(178,58,46,.12);color:var(--bad);border-color:rgba(178,58,46,.4)}
  .b-earn{background:rgba(178,58,46,.12);color:var(--bad);border-color:rgba(178,58,46,.4)}
  .b-depot{background:var(--teal-dim);color:var(--primary);border-color:rgba(31,110,102,.35)}
  .b-neu{background:rgba(46,139,87,.12);color:var(--ok);border-color:rgba(46,139,87,.4)}

  h2{font-size:15px;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:8px;color:var(--txt)}
  .sub{font-size:11px;font-weight:400;color:var(--muted2)}

  /* Aufklappbare Themenblöcke (seit 2026-08-16): Charttechnik/Technische
     Analyse/Fundamentalanalyse werden je eine eigene <details class="acc">
     statt fester h2-Abschnitte - eigenes, schlankes Muster statt des
     wiki.html-Accordions (dessen dunkles Serif-Design passt nicht zu dieser
     hellen "Tagesordnung"-Optik, siehe CLAUDE.md Anleitungsseiten-Regel:
     drei Design-Systeme, nicht angleichen). */
  .acc{background:var(--card);border:1px solid var(--line);border-radius:14px;
       box-shadow:var(--shadow);margin:20px 0;overflow:hidden}
  .acc>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;
               align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--txt)}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .acc-sub{font-size:11px;font-weight:400;color:var(--muted2)}
  .acc>summary .acc-count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);
                           background:var(--line2);border-radius:20px;padding:2px 10px;white-space:nowrap}
  .acc>summary .chev{color:var(--muted2);transition:transform .15s;flex-shrink:0}
  .acc[open]>summary .chev{transform:rotate(180deg)}
  .acc-body{padding:0 20px 20px;border-top:1px solid var(--line)}
  .acc-body>*:first-child{margin-top:16px}
  .subhead{font-size:13px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;color:var(--txt)}

  /* Erläuterungen zu den Kriterien erscheinen als native Tooltips (title-Attribut)
     bei Hover - [title] bekommt einen Hilfe-Cursor als Hinweis, dass dort mehr
     Info steckt (Sofort-Überblick ist bewusst kompakt, ohne sichtbaren Text). */
  [title]{cursor:help}
  .quickscan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .qs-item{display:flex;align-items:center;gap:7px;font-size:12.5px;
           background:var(--card);border:1px solid var(--line);border-radius:8px;
           padding:10px 12px;box-shadow:var(--shadow)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .d-gruen{background:var(--ok)} .d-gelb{background:var(--warn)} .d-rot{background:var(--bad)} .d-na{background:#C9C3B4}

  /* Erfüllt/nicht-erfüllt visuell klarer trennen (seit 2026-08-16): bisher
     unterschied sich nur der kleine Ampel-Punkt, alle Karten wogen optisch
     gleich viel. Grün jetzt mit Tint+Rand hervorgehoben, Rot/n.v. bewusst
     blasser (reduzierte Deckkraft, kein Schatten) - erfüllte Kriterien
     sollen beim ersten Blick auffallen, nicht erfüllte in den Hintergrund
     treten, ohne komplett zu verschwinden (weiterhin lesbar). */
  .qs-item.q-gruen{border-color:rgba(46,139,87,.4);background:rgba(46,139,87,.07)}
  .qs-item.q-gruen span{color:var(--ok);font-weight:600}
  .qs-item.q-rot,.qs-item.q-na{opacity:.55;box-shadow:none}

  .chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
              margin-top:14px;box-shadow:var(--shadow)}
  .chart-wrap svg{width:100%;height:auto;display:block}
  .chart-cap{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
  .tv-box{height:480px;border-radius:10px;overflow:hidden}
  .tv-box .tradingview-widget-container,.tv-box .tradingview-widget-container__widget{height:100%;width:100%}
  .chart-links{display:flex;gap:8px;margin-top:10px}
  .chart-links a{font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid var(--line);
                 text-decoration:none;color:var(--txt);background:var(--card);
                 display:inline-flex;align-items:center;min-height:44px}
  .chart-links a:hover{border-color:var(--primary)}

  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
         display:flex;gap:10px;box-shadow:var(--shadow)}
  .fcard .dot{margin-top:4px}
  .fcard-body{flex:1;min-width:0}
  .fcard-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .fcard-lbl{font-size:12.5px;font-weight:700}
  .fcard-wert{font-size:12px;color:var(--muted);white-space:nowrap}
  .fcard-detail{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
  .fcard-gew{font-size:10.5px;color:var(--muted2);margin-top:5px}
  .fcard-gruen{border-color:rgba(46,139,87,.45);background:rgba(46,139,87,.06)}
  .fcard-gruen .fcard-lbl{color:var(--ok)}
  .fcard-gelb{border-color:rgba(192,138,46,.4)}
  .fcard-rot,.fcard-na{opacity:.55;box-shadow:none}

  .klimax-warn{background:rgba(178,58,46,.08);border:1px solid rgba(178,58,46,.35);border-radius:12px;
               padding:10px 14px;font-size:12.5px;color:var(--bad);margin-bottom:12px}

  .pivotcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
             margin-bottom:12px;box-shadow:var(--shadow)}
  .pivotcard .phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .pivotcard .pdetail{font-size:13px;color:var(--txt);margin-bottom:10px}
  .kennz{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;font-size:11.5px}
  .kennz div{background:var(--line2);border-radius:8px;padding:6px 9px}
  .kennz b{display:block;font-size:13px;color:var(--txt)}

  /* Quartalsergebnisse-Tabelle (seit 2026-08-24): eigene, schlanke Tabelle
     statt .fgrid-Karten - bei bis zu 5 Spalten x 3 Zeilen lesbarer als
     Karten nebeneinander. */
  .qtable-wrap{overflow-x:auto}
  .qtable{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  .qtable th,.qtable td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
  .qtable th:first-child,.qtable td:first-child{text-align:left;color:var(--muted)}
  .qtable th{font-size:10.5px;color:var(--muted2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
  .qtable td.qpos{color:var(--ok)} .qtable td.qneg{color:var(--bad)}

  /* Story-Zitat (seit 2026-08-09): einzige Serif-Stelle der Seite - siehe
     renderStory()/renderDeep() im Script, dort in .story-quote gewrappt.
     Alles andere bleibt Sans/Mono, damit der Akzent nicht verwaessert. */
  .story-quote{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
               font-style:italic;font-size:15.5px;line-height:1.55;color:var(--txt);
               border-left:3px solid var(--primary);padding-left:14px;margin:4px 0 12px}

  .pabadges{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .pabadges .badge{border-radius:6px}
  .stadium{font-size:10.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);font-weight:700}
  .st-Advancing{background:rgba(46,139,87,.12);color:var(--ok)}
  .st-Accumulation{background:var(--teal-dim);color:var(--primary)}
  .st-Distribution{background:rgba(192,138,46,.14);color:var(--warn)}
  .st-Declining{background:rgba(178,58,46,.12);color:var(--bad)}

  .srcrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
  .deepbtn{font:inherit;font-size:13px;font-weight:700;color:var(--primary);background:var(--teal-dim);
    border:1px solid rgba(31,110,102,.35);border-radius:10px;padding:9px 16px;cursor:pointer;transition:background .15s;
    display:inline-flex;align-items:center;justify-content:center;min-height:44px}
  .deepbtn:hover{background:rgba(31,110,102,.16)}

  .extlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .extlinks a{font-size:12.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);
              text-decoration:none;color:var(--txt);background:var(--card);
              display:inline-flex;align-items:center;min-height:44px}
  .extlinks a:hover{border-color:var(--primary)}

  .disclaimer{margin-top:28px;font-size:11.5px;color:var(--muted2);line-height:1.5;
              border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<header>
  <a class="back" id="backlink" href="signal-hub.html">← Signal Hub</a>
  <h1 id="headtitle">🎯 Setup-Analyse</h1>
  <input type="search" id="tickerswitch" placeholder="Ticker wechseln …"
    title="Anderen Ticker direkt in dieser Ansicht öffnen, ohne die Seite zu verlassen"
    onkeydown="if(event.key==='Enter') wechsleTicker(this.value)">
  <span class="stand" id="stand"></span>
</header>
<main>
  <div id="loading">Lädt Technik-, Fundamental- und Chartdaten …</div>
  <div id="notfound" style="display:none">
    Kein Treffer für <b id="nf-ticker"></b> gefunden — entweder kein aktueller Signal-Hub-Kandidat
    (Score unter „Beobachten") oder noch nicht von Price-Action-Hub/Pivot-Detektor bewertet.
    <div style="margin-top:14px"><a href="signal-hub.html">→ zum Signal Hub</a></div>
  </div>
  <div id="content" style="display:none"></div>
</main>
<script>
// =====================================================================
//  Setup-Analyse: sofortiger Minervini-Überblick (technisch/fundamental/
//  charttechnisch) für EINEN Ticker aus den Top-Setups. Reiner Frontend-
//  JSON-Join wie Price-Action-Hub/src/top_setups.py (kein Cross-App-Python-
//  Import, siehe CLAUDE.md "Entflechtung") - liest drei fertige Ausgaben:
//    Signal-Hub/data/signals.json          - Score + 11 Faktoren (Minervini-
//                                             Trend-Template, RS, Fundamental...)
//    Signal-Hub/data/pivot.json            - Pivot-Armed-Detektor (VCP/Ausbruch)
//    Price-Action-Hub/data/priceaction.json - Candlestick-Musteranalyse
//  Aufruf: setup-detail.html?ticker=NVDA
// =====================================================================
const params = new URLSearchParams(location.search);
let TICKER = (params.get('ticker') || '').toUpperCase();

// Fundamentalanalyse/News/Story (seit 2026-08-02): live bei jedem Aufruf ueber
// denselben Cloudflare-Worker, den Hauptapp/Coach/Markets-360 schon als
// MTS_PROXY fuer Yahoo/FRED nutzen (siehe cloudflare-worker/README.md) - der
// neue /story-Endpunkt holt dort serverseitig Yahoo-Fundamentaldaten + News
// und laesst Claude (ANTHROPIC_API_KEY als Worker-Secret, nie im Client-Code)
// daraus eine kurze, rein informative Zusammenfassung schreiben. Kein neuer
// Worker noetig, kein zweites Deployment.
const MTS_PROXY = 'https://mts-cors.miksch267.workers.dev/';

const FAKTOR_INFO = {
  stage2_trend:        {icon:'📈', label:'Stage-2-Trend-Template', explain:
    'Minervini Stage-2-Trend-Template: 8 Kriterien für einen intakten Aufwärtstrend (Kurs über SMA150 und SMA200, SMA150 über SMA200, SMA200 und SMA150 steigen, SMA50 über SMA150 über SMA200, Kurs über SMA50, mind. 30% über 52W-Tief, max. 25% unter 52W-Hoch). Je mehr erfüllt, desto stabiler die Basis für eine neue Position.'},
  relative_staerke:    {icon:'⚡', label:'Relative Stärke', explain:
    'Gewichtete Kursentwicklung gegen den Markt-Index über 3/6/9/12 Monate (40/20/20/20, jüngste Monate zählen mehr) plus Perzentil-Rang im aktuellen Kandidatenpool. Minervini/IBD: relative Stärke ist ein Rang, keine absolute Zahl.'},
  naehe_52w_hoch:      {icon:'🎯', label:'Nähe 52W-Hoch', explain:
    'Abstand zum 52-Wochen-Hoch. Minervini kauft Führungsaktien nahe an neuen Hochs statt vermeintlich billiger Werte weit darunter.'},
  basis_konsolidierung:{icon:'📦', label:'Basis-Konsolidierung', explain:
    'Vergleicht die Kursspanne der letzten 4 Wochen mit den 8 Wochen davor. Eine sich verengende Basis (VCP, Volatility Contraction Pattern) zeigt abnehmenden Verkaufsdruck vor einem möglichen Ausbruch.'},
  volumen_bestaetigung:{icon:'📊', label:'Volumen-Bestätigung', explain:
    'Volumen der letzten 5 Tage im Verhältnis zum 50-Tage-Durchschnitt. Ein Trend ohne Volumen-Bestätigung ist fragiler - Institutionen hinterlassen Volumenspuren.'},
  smart_money:         {icon:'💰', label:'Smart Money (U/D-Volumen)', explain:
    'Up/Down-Volumen-Verhältnis über 50 Tage: Volumen an steigenden gegen Volumen an fallenden Tagen. Werte über 1 deuten auf Akkumulation statt Distribution hin.'},
  cmf:                 {icon:'🌊', label:'Chaikin Money Flow', explain:
    'Chaikin Money Flow (21 Tage): misst, ob der Schlusskurs eher im oberen (Akkumulation) oder unteren (Distribution) Bereich der Tagesspanne liegt, gewichtet mit Volumen.'},
  quellen_konsens:     {icon:'🔗', label:'Quellen-Konsens', explain:
    'Wie viele unabhängige Quellen (TraderFox, Finviz-Screener, Mail-Signale ...) diesen Ticker unabhängig voneinander highlighten. Mehrfachbestätigung senkt das Risiko eines Einzelfehlers.'},
  sektor_staerke:      {icon:'🏭', label:'Branchenstärke', explain:
    'Rang des zugehörigen Sektor-ETFs unter allen 11 S&P-500-Sektoren nach relativer Stärke. Minervini: erst die führende Branchengruppe finden, dann den Marktführer darin.'},
  minervini_5080:      {icon:'⚠️', label:'50/80-Klimax-Check', explain:
    'Minervini 50/80-Regel: nach einem scharfen Kurs-Gap auf hohem Volumen (typische Gewinnwarnung) besteht laut Minervini für rund 8 Monate erhöhtes Risiko eines Rückfalls unter das Gap-Tief.'},
  fundamental:         {icon:'💵', label:'Fundamental (EPS/Umsatz)', explain:
    'CANSLIM/SEPA-Bestätigung: Gewinn- und Umsatzwachstum gegenüber Vorjahr. Minervini bevorzugt Aktien mit beschleunigtem Gewinnwachstum, nicht nur charttechnische Stärke.'},
};
const VERIFY_EXPLAIN = 'Unabhängige Gegenprüfung des Stage-2-Trend-Templates: berechnet die 8 Kriterien frisch aus eigenen Yahoo-Kursdaten (Cloudflare Worker, sieht die Pipeline-Begründung nicht) und vergleicht sie mit dem gespeicherten Wert. Rein deterministisch, kein KI-Aufruf - Prinzip "wer etwas berechnet hat, prüft es nicht selbst nach".';
const PIVOT_EXPLAIN = 'Pivot-Armed-Detektor (ergänzt den nachlaufenden Score um die Entstehung des Ausbruchs): BREAKOUT = frischer Ausbruch über die Basis auf hohem Volumen. ARMED = enge, ausgetrocknete Basis knapp unter dem Pivot (Pre-Breakout). WATCH = Trend intakt, Basis noch nicht reif. CHEAT = früher Ausbruch vor vollem Trend-Template, klein positionieren.';
const PA_EXPLAIN = 'Unabhängige Candlestick-Musteranalyse (Trendbar, Breakout, Gap, Bar-Counting) aus dem Price-Action-Hub - positiver Wert = bullisches Chartbild, kein Ersatz für den Score.';
const STADIUM_EXPLAIN = 'Weinstein-Stadium-Modell: Advancing/Accumulation = Aufwärtsphase, Distribution/Declining = Abwärtsphase - gemessen an Kurs gegen den gleitenden 200-Tage-Durchschnitt und dessen Steigung.';
// "Code 33" (Mark Minervini, Quelle: aktienmagazin.de "Die Strategie zur ersten
// Million"): EPS, Umsatz und Nettogewinnmarge steigen drei Quartale in Folge -
// signalisiert institutionelles Interesse. Die konkreten Schwellenwerte
// stammen aus Tabelle 4 desselben Artikels ("Screening Parameter" ->
// "Umsetzung in TraderFox", vom Nutzer als Bild bereitgestellt, im Fliesstext
// nicht auslesbar): EPS-Wachstum Quartal ggü. Vorjahr > 40 %, Umsatzwachstum
// Quartal ggü. Vorjahr > 7 %, Nettogewinnmarge um > 2 Prozentpunkte verbessert
// (2-3 Quartale zurückgerechnet). Wird serverseitig im Worker aus Yahoos
// fundamentals-timeseries-Endpunkt berechnet (siehe
// cloudflare-worker/mts-cors-proxy.js::fetchCode33) und kommt als
// fundamentals.code33 mit der /story-Antwort, daher erst nach ladeStory() da.
// Die in derselben Tabelle als "optional" markierte "Stabilität
// Nettogewinnmarge (0,7-1,0; 3 Jahre)" ist bewusst NICHT mitgerechnet - eine
// proprietäre TraderFox-Kennzahl ohne öffentlich dokumentierte Formel, die

const YAHOO_SUFFIX_TV_EXCHANGE = {
  DE:'XETR', F:'XETR', MU:'XETR', PA:'EURONEXT', AS:'EURONEXT',
  L:'LSE', SW:'SIX', MI:'MIL', ST:'OMXSTO', OL:'OSL', CO:'OMXCOP',

  const bc=m.bar_counting;
  if(bc && bc.typ) out.push(`<span class="badge ${bc.zuverlaessig?(bc.typ.startsWith('High')?'b-pa-bull':'b-pa-bear'):''}" title="Zählt Bars seit dem letzten Swing-Hoch/-Tief (Livermore-Stil): wenige Bars = zuverlässigeres Fortsetzungssignal, viele Bars = spät und weniger aussagekräftig. ${bc.seit_swing_bars} Bar(s) seit Swing">📐 ${bc.typ}${bc.zuverlaessig?'':' (spät)'}</span>`);
  const bo=m.breakout;
  if(bo && (bo.breakout_up||bo.breakout_down)){
    const st=bo.staerke||{};
    out.push(`<span class="badge ${bo.breakout_up?'b-pa-bull':'b-pa-bear'}" title="Kurs durchbricht ein vorheriges Referenzband auf erhöhtem Volumen. Vol-Ratio ${st.vol_ratio??'–'}x">🚀 Breakout ${bo.breakout_up?'↑':'↓'}${st.vol_ratio?' '+st.vol_ratio+'x Vol':''}</span>`);
    if(bo.failed) out.push(`<span class="badge b-pa-bear" title="Kurs ist binnen 5 Bars wieder zurück ins Referenzband gefallen - der Ausbruch hat nicht gehalten, Warnsignal.">⛔ Failed</span>`);
  }
  const g=m.gap;
  if(g && (g.gap_up||g.gap_down)) out.push(`<span class="badge ${g.gap_up?'b-pa-bull':'b-pa-bear'}" title="Kurslücke zwischen Vortagesschluss und heutiger Spanne - ${g.gefuellt?'bereits wieder geschlossen (schwächeres Signal)':'noch offen (stärkeres Signal)'}.">↕️ Gap ${g.gap_pct>0?'+':''}${g.gap_pct}%${g.gefuellt?' (gefüllt)':''}</span>`);
  return out.join('') || '<span class="badge">keine auffälligen Muster</span>';
}

// ─── Dividendenkontinuität (seit 2026-08-16) ───────────────────────────────
// Eigener, von /story unabhängiger Abruf über den bereits bestehenden
// generischen ?url=-CORS-Proxy (query1.finance.yahoo.com steht schon in der
// ALLOW-Liste des Workers, siehe cloudflare-worker/mts-cors-proxy.js) - kein
// neuer Worker-Endpunkt nötig. Holt die Dividendenhistorie über den
// Chart-Endpunkt (events=div) und bewertet Kontinuität (aufeinanderfolgende
// Jahre mit Zahlung) sowie Trend (steigend/gleichbleibend/gekürzt), ein
// klassisches Buffett/Graham-Qualitätsmerkmal.
const DIVIDEND_EXPLAIN = 'Dividendenhistorie aus Yahoo Finance (bis zu 10 Jahre zurück). Zählt aufeinanderfolgende Jahre mit gezahlter Dividende und vergleicht die letzten vollständigen Jahressummen - Kontinuität/Wachstum ist ein klassisches Buffett/Graham-Qualitätsmerkmal, eine Kürzung ein Warnsignal. Rein informativ, kein Score-Bestandteil.';
// Ausgelagert aus renderDividenden() (seit 2026-08-16), damit dieselbe
// Berechnung auch fuer das Dividend Discount Model in der "Innerer Wert"-
// Sektion unten wiederverwendet werden kann, statt die Jahressummen-Logik
// zweimal zu pflegen.
function berechneDividendenKennzahlen(eintraege){
  if(!eintraege.length) return null;
  const proJahr = {};
  eintraege.forEach(e => { const j = e.datum.getFullYear(); proJahr[j] = (proJahr[j]||0) + e.betrag; });
  const jahre = Object.keys(proJahr).map(Number).sort((a,b)=>a-b);
  const heuteJahr = new Date().getFullYear();
  let serie = 0;
  for(let j = jahre[jahre.length-1]; j >= jahre[0]; j--){
    if(proJahr[j] > 0) serie++; else break;
  }
  // Trend/Wachstum nur über abgeschlossene Jahre vergleichen - das laufende
  // Jahr hat ggf. noch nicht alle Ausschüttungen erhalten und würde sonst
  // faelschlich wie eine Kürzung aussehen.
  const vergleichsJahre = jahre.filter(j => j < heuteJahr);
  const jLetztes = vergleichsJahre[vergleichsJahre.length-1];
  const jVorher = vergleichsJahre[vergleichsJahre.length-2];
  let trend = 'zu wenig Historie', wachstumsrate = null;
  if(jLetztes!=null && jVorher!=null){
    if(proJahr[jVorher] > 0) wachstumsrate = (proJahr[jLetztes] - proJahr[jVorher]) / proJahr[jVorher];
    if(proJahr[jLetztes] > proJahr[jVorher]*1.02) trend = 'steigend';
    else if(proJahr[jLetztes] < proJahr[jVorher]*0.98) trend = 'gekürzt';
    else trend = 'gleichbleibend';
  }
  // Fuer das DDM eine geglaettete Mehrjahres-Wachstumsrate (CAGR) statt nur
  // des letzten Einzelvergleichs, wenn genug abgeschlossene Jahre vorliegen -
  // robuster gegen ein einzelnes Ausreisser-Jahr. Das AELTESTE Jahr im
  // 10-Jahres-Fenster wird dafuer verworfen: range=10y schneidet fast nie
  // exakt am 1. Januar, das erste Kalenderjahr im Ergebnis ist deshalb fast
  // immer unvollstaendig (z.B. nur 2 von 4 Quartalsdividenden) und wuerde die
  // CAGR sonst kraeftig nach oben verzerren (verifiziert gegen JNJ: mit dem
  // verkuerzten Startjahr 13,8%, ohne 5,6% - die 5,6% passen zur bekannten
  // langjaehrigen JNJ-Dividendenwachstumsrate).
  const cagrJahre = vergleichsJahre.slice(1);
  if(cagrJahre.length >= 4){
    const erstes = cagrJahre[0], letztes = cagrJahre[cagrJahre.length-1];
    const n = letztes - erstes;
    if(n > 0 && proJahr[erstes] > 0 && proJahr[letztes] > 0){
      wachstumsrate = Math.pow(proJahr[letztes]/proJahr[erstes], 1/n) - 1;
    }
  }
  const ampel = trend==='gekürzt' ? 'rot' : serie>=5 ? 'gruen' : serie>=2 ? 'gelb' : 'rot';
  const jahresliste = jahre.slice(-8).map(j => `${j}: ${proJahr[j].toFixed(2)}`).join(' · ');
  return {
    serie, trend, ampel, jahresliste, wachstumsrate,
    dividendeLetztesVollstaendigesJahr: jLetztes!=null ? proJahr[jLetztes] : null,
  };
}

// ─── Innerer Wert: Graham Number, Owner-Earnings-DCF, DDM (seit 2026-08-16) ─
// Klassische Buffett/Graham-Bewertungsansaetze zur Frage "steht die Aktie
// unter ihrem inneren Wert" - drei unabhaengige, bewusst einfache Heuristiken
// statt eines einzelnen "richtigen" Werts (Graham selbst empfahl, mehrere
// Ansaetze gegenzurechnen statt einem Modell blind zu vertrauen). Graham
// Number + DCF nutzen ausschliesslich Felder, die /story ohnehin schon
// liefert (trailingEps, bookValue, freeCashflow, sharesOutstanding, siehe
// cloudflare-worker/mts-cors-proxy.js::fetchYahooFundamentalsAndNews) - kein
// zusaetzlicher Datenabruf. Das DDM nutzt die bereits geladene Dividenden-
// historie (siehe berechneDividendenKennzahlen oben). Bewusst KEIN Score-
// Einfluss - eine wertorientierte Zweitmeinung neben dem sonst wachstums-
// orientierten Minervini/CANSLIM-System.
const WERT_DISKONTSATZ = 0.09;      // fixer Diskontsatz statt WACC/Beta - transparente, grobe Annahme
const WERT_TERMINALWACHSTUM = 0.025; // langfristig ~BIP-Wachstum als Terminalrate im DCF

function grahamNumber(eps, bvps){
  if(eps==null || bvps==null || eps<=0 || bvps<=0) return null;
  return Math.sqrt(22.5 * eps * bvps);
}
// Vereinfachtes 2-Phasen-DCF nach Buffetts "Owner Earnings": freier Cashflow
// je Aktie 5 Jahre mit g1 fortgeschrieben (gedeckelt 0-15%, aus Gewinn-/
// Umsatzwachstum abgeleitet), danach ein Terminalwert mit WERT_TERMINALWACHSTUM.
// Nutzt Yahoos financialData.freeCashflow (bereits Operating-Cashflow minus
// Capex) statt einer eigenen Bilanzrechnung - kein zusaetzliches Modul noetig.
function dcfFairValue(fcfProAktie, wachstumRoh){
  if(fcfProAktie==null || fcfProAktie<=0) return null;
  const g1 = Math.max(0, Math.min(wachstumRoh ?? 0.05, 0.15));
  const r = WERT_DISKONTSATZ, gT = WERT_TERMINALWACHSTUM;
  let barwert = 0, fcf = fcfProAktie;
  for(let jahr=1; jahr<=5; jahr++){
    fcf = fcf * (1+g1);
    barwert += fcf / Math.pow(1+r, jahr);
  }
  const terminalwert = (fcf*(1+gT)) / (r-gT);
  barwert += terminalwert / Math.pow(1+r, 5);
  return barwert;
}
function ddmFairValue(dividendeProAktie, wachstum){
  if(dividendeProAktie==null || dividendeProAktie<=0) return null;
  if(wachstum==null || wachstum >= WERT_DISKONTSATZ) return null;
  const d1 = dividendeProAktie * (1+wachstum);
  return d1 / (WERT_DISKONTSATZ - wachstum);
}
function ampelSicherheitsmarge(preis, fairValue){
  if(fairValue==null || fairValue<=0 || preis==null) return 'na';
  const marge = (fairValue - preis) / fairValue;
  if(marge >= 0.20) return 'gruen';
  if(marge >= 0) return 'gelb';
  return 'rot';
}
function fmtWertZahl(v){ return v==null ? '—' : v.toFixed(2); }
function sicherheitsmargeText(preis, fairValue, currency){
  if(fairValue==null) return 'nicht berechenbar (fehlende Kennzahlen)';
  if(preis==null) return `Schätzwert ${fmtWertZahl(fairValue)} ${currency||''}`;
  const diffPct = (fairValue - preis) / fairValue * 100;
  const richtung = diffPct >= 0 ? 'unter' : 'über';
  return `Kurs ${fmtWertZahl(preis)} ${currency||''} · ${Math.abs(diffPct).toFixed(0)}% ${richtung} dem Schätzwert`;
}
const WERT_EXPLAIN = {
  graham: 'Benjamin Grahams klassische Defensiv-Formel: √(22,5 × Gewinn je Aktie (trailing) × Buchwert je Aktie). Grahams historischer Richtwert für eine konservative Bewertungsobergrenze - deutlich darüber galt ihm als teuer. Ignoriert Wachstum und Qualität, rein heuristisch.',
  dcf: `Vereinfachtes Discounted-Cashflow-Modell nach Buffetts "Owner Earnings"-Ansatz: freier Cashflow je Aktie wird 5 Jahre mit einer aus Gewinn-/Umsatzwachstum abgeleiteten Rate (gedeckelt 0-15% p.a.) fortgeschrieben, mit ${(WERT_DISKONTSATZ*100).toFixed(0)}% abgezinst, danach ein Terminalwert mit ${(WERT_TERMINALWACHSTUM*100).toFixed(1)}% ewigem Wachstum. Eigene, transparente Annahmen statt Analysten-Konsens - eine grobe Hausnummer, kein Kursziel.`,
  ddm: `Dividend Discount Model (Gordon-Wachstumsmodell): letzte volle Jahresdividende mit der mehrjährigen Dividenden-Wachstumsrate (siehe Dividendenkontinuität oben) fortgeschrieben, mit ${(WERT_DISKONTSATZ*100).toFixed(0)}% abgezinst. Nur anwendbar, wenn die Dividende wächst und langsamer als der Diskontsatz.`,
};
function fcardWert(icon, label, explain, fairValue, preis, currency){
  const ampel = ampelSicherheitsmarge(preis, fairValue);
  return `<div class="fcard fcard-${ampel}">${dot(ampel)}<div class="fcard-body">
    <div class="fcard-head">
      <span class="fcard-lbl" title="${explain}">${icon} ${label}</span>
      <span class="fcard-wert">${fairValue==null?'—':fmtWertZahl(fairValue)+' '+(currency||'')}</span>
    </div>
    <div class="fcard-detail">${sicherheitsmargeText(preis, fairValue, currency)}</div>
    <div class="fcard-gew">nicht Teil des Scores - Buffett/Graham-Heuristik, keine Kauf-/Verkaufsempfehlung</div>
  </div></div>`;
}
let WERT_PREIS = null, WERT_CURRENCY = null, WERT_FX = null, WERT_DIVIDENDE = null;
function renderInnererWert(){
  const el = document.getElementById('wertwrap');
  if(!el) return;
  const fx = WERT_FX || {};
  const preis = WERT_PREIS, currency = WERT_CURRENCY;
  const graham = grahamNumber(fx.trailingEps, fx.bookValue);
  const fcfProAktie = (fx.freeCashflow!=null && fx.sharesOutstanding) ? fx.freeCashflow / fx.sharesOutstanding : null;

  el.innerHTML = [

        </div></div>`,
  ].join('');
}

// Zahl kompakt formatieren (Marktkap. etc.) - Mrd/Mio statt langer Ziffernketten.
function fmtGross(v){
  if(v==null) return '—';
  const a = Math.abs(v);
  if(a >= 1e9) return (v/1e9).toFixed(1)+' Mrd';
  if(a >= 1e6) return (v/1e6).toFixed(0)+' Mio';
  return String(v);
}
function fmtPct(v){ return v==null ? '—' : (v*100).toFixed(1)+'%'; }
// Statt der Woerter "trailing"/"forward" das echte Geschaeftsjahr anzeigen
// (seit 2026-08-24, auf Nutzerwunsch) - lastFiscalYearEnd/nextFiscalYearEnd
// sind Unix-Timestamps des jeweiligen Bilanzstichtags (siehe
// cloudflare-worker/mts-cors-proxy.js::fetchYahooFundamentalsAndNews).
// Fallback auf aktuelles Kalenderjahr (+1 fuer "naechstes Jahr"), falls
// Yahoo die Felder fuer diesen Ticker nicht liefert.
function fiskaljahrLabel(epochSec, fallbackOffset){
  if(epochSec!=null){
    const d = new Date(epochSec*1000);
    if(!isNaN(d)) return d.getFullYear();
  }
  return new Date().getFullYear() + fallbackOffset;
}

// Story/News kommen live von Yahoo bzw. der KI-Zusammenfassung - anders als
// die kuratierten Pipeline-Dateien (signals.json etc.) nicht "hausgemacht",
// deshalb hier bewusst escapen statt roh per innerHTML einzufuegen (XSS-Haertung).
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderStory(d){
  const fx = d.fundamentals || {};
  const jahrTrailing = fiskaljahrLabel(fx.lastFiscalYearEnd, 0);
  const jahrForward = fiskaljahrLabel(fx.nextFiscalYearEnd, 1);
  // FCF-Marge (seit 2026-08-27, Nutzerwunsch "FCF als Wert UND in Prozent"):
  // Yahoo liefert keinen fertigen Umsatzwert in fundamentals, aber
  // priceToSales (trailing) = marketCap / Umsatz - daraus laesst sich der
  // Umsatz zurueckrechnen, ohne einen weiteren Yahoo-Aufruf zu brauchen.
  const umsatzTTM = (fx.marketCap!=null && fx.priceToSales!=null && fx.priceToSales>0) ? fx.marketCap/fx.priceToSales : null;
  const fcfMarge = (fx.freeCashflow!=null && umsatzTTM!=null && umsatzTTM>0) ? fx.freeCashflow/umsatzTTM : null;
  const kennz = [
    ['Marktkap.', fmtGross(fx.marketCap) + (d.currency?(' '+d.currency):'')],
    ['KGV ' + jahrTrailing, fx.trailingPE!=null ? fx.trailingPE.toFixed(1) : '—'],
    ['KGV ' + jahrForward + ' (Schätzung)', fx.forwardPE!=null ? fx.forwardPE.toFixed(1) : '—'],
    ['KUV ' + jahrTrailing, fx.priceToSales!=null ? fx.priceToSales.toFixed(1) : '—'],
    ['KUV ' + jahrForward + ' (Schätzung)', fx.priceToSalesForward!=null ? fx.priceToSalesForward.toFixed(1) : '—'],
    ['Free Cashflow', fx.freeCashflow!=null ? fmtGross(fx.freeCashflow) + (d.currency?(' '+d.currency):'') : '—'],
    ['FCF-Marge', fmtPct(fcfMarge)],
    ['Umsatzwachstum (YoY)', fmtPct(fx.revenueGrowth)],
    ['Gewinnwachstum (YoY)', fmtPct(fx.earningsGrowth)],
    ['Bruttomarge', fmtPct(fx.grossMargins)],
    ['Analysten-Konsens (Yahoo)', esc(fx.recommendationKey) || '—'],
  ];
  const newsHtml = (d.news || []).map(n => {
    const href = /^https?:\/\//.test(n.link||'') ? n.link : null;
    const titel = esc(n.title);
    return `<div style="margin-top:9px;font-size:12.5px">
      ${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${titel}</a>` : titel}
      <div style="color:var(--muted);font-size:11px">${esc(n.publisher)||''}${n.zeit ? ' · '+esc(n.zeit) : ''}</div>
    </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:12.5px">Keine aktuellen Schlagzeilen gefunden.</div>';
  const stand = d.erstellt ? new Date(d.erstellt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : '';
  return `
    <div class="pivotcard">
      <div class="pdetail"><b>Unternehmen:</b> ${esc(d.profil) || '—'}</div>
      <div class="story-quote">${d.story ? '„'+esc(d.story)+'"' : '—'}</div>
      <div class="kennz">${kennz.map(([l,v])=>`<div><b>${v}</b>${l}</div>`).join('')}</div>
    </div>
    <div class="pivotcard">
      <div class="pdetail" style="margin-bottom:0">📰 Aktuelle Schlagzeilen</div>
      ${newsHtml}
    </div>
    <div style="font-size:10.5px;color:var(--muted);margin-top:2px">
      KI-generierte Zusammenfassung (Claude, Yahoo-Finance-Daten) · rein informativ, keine Anlageberatung,
      keine Kauf-/Verkaufsempfehlung · Stand ${stand} Uhr
    </div>`;
}

// Kompakte Geldbetraege (Mrd/Mio) hat schon fmtGross weiter unten, aber
// Quartalsumsaetze liegen meist im Mio-Bereich und wechseln bei kleineren
// Nebenwerten leicht in einstellige Millionen - eigene, etwas feinere
// Formatierung statt fmtGross' 0-Nachkommastellen bei Mio.
function fmtQuartalGeld(v){
  if(v==null) return '—';
  const a = Math.abs(v);
  if(a >= 1e9) return (v/1e9).toFixed(2)+' Mrd';
  if(a >= 1e6) return (v/1e6).toFixed(1)+' Mio';
  return v.toFixed(0);
}
function fmtQuartalDatum(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso || '—';
  return d.toLocaleDateString('de-DE', {year:'numeric', month:'short'});
}
function qoqTd(pct){
  if(pct==null) return '<td>—</td>';
  const cls = pct > 0 ? 'qpos' : pct < 0 ? 'qneg' : '';
  return `<td class="${cls}">${pct>0?'+':''}${pct.toFixed(1)}%</td>`;
}
function renderQuartalstabelle(serie){
  if(!serie || !serie.length){
    return '<div class="pivotcard"><div class="pdetail" style="color:var(--muted)">Keine Quartalsdaten verfügbar.</div></div>';
  }
  // Neuestes Quartal zuerst (die Worker-Serie liefert aufsteigend, weil die
  // QoQ-Veraenderung dort gegen das jeweils VORHERIGE - also aeltere -
  // Quartal berechnet wird; hier nur fuer die Anzeige umgedreht).
  // Nettomarge (seit 2026-08-27, Nutzerwunsch "Quartalsergebnisse um die
  // Werte des Code 33 ergaenzen"): dieselbe Nettomarge-Zahl, die Code 33 oben
  // fuer die Erfuellungspruefung nutzt (marge_delta_pp/marge_aktuell_pct),
  // hier je Quartal statt nur als Einzelwert des juengsten Quartals.
  const rows = serie.slice().reverse().map(q => `<tr>
    <td>${fmtQuartalDatum(q.quartal)}</td>
    <td>${fmtQuartalGeld(q.umsatz)}</td>
    ${qoqTd(q.umsatz_qoq_pct)}
    <td>${q.eps!=null ? q.eps.toFixed(2) : '—'}</td>
    ${qoqTd(q.eps_qoq_pct)}
    <td>${q.marge_pct!=null ? q.marge_pct.toFixed(1)+'%' : '—'}</td>
  </tr>`).join('');
  return `<div class="pivotcard">
    <div class="qtable-wrap"><table class="qtable">
      <thead><tr><th>Quartal</th><th>Umsatz</th><th>Δ QoQ</th><th>EPS</th><th>Δ QoQ</th><th>Nettomarge</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="fcard-gew" style="margin-top:8px">nicht Teil des Scores - reine Verlaufsansicht, keine Kauf-/Verkaufsempfehlung</div>
  </div>`;
}
function setQuartalstabelle(serie){
  const el = document.getElementById('quartalwrap');
  if(el) el.innerHTML = renderQuartalstabelle(serie);
}

// ─── Unabhängige Gegenprüfung (seit 2026-08-09) ─────────────────────────
// Rechnet die 8 Stage-2-Trend-Template-Kriterien im Worker frisch aus einem
// eigenen Yahoo-Kursabruf nach (siehe cloudflare-worker/mts-cors-proxy.js::
// handleVerify) - unabhängig von signals.json, kein KI-Aufruf (harte
// Zahlenvergleiche statt einer Meinung). Manuell per Button wie der
// erweiterte Bericht, damit nicht bei jedem Seitenaufruf automatisch ein
// zusätzlicher Yahoo-Abruf läuft.
function renderVerify(d, claimedWert){
  const claimedErfuellt = (claimedWert!=null && !isNaN(claimedWert)) ? Math.round(claimedWert * d.gesamt) : null;
  const abweichend = claimedErfuellt!=null && claimedErfuellt !== d.erfuellt;
  const rows = d.kriterien.map(k => `<div class="qs-item">${dot(k.erfuellt?'gruen':'rot')}<span>${esc(k.label)}</span></div>`).join('');
  const stand = d.erstellt ? new Date(d.erstellt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : '';
  let urteil;
  if(!d.historie_ausreichend) urteil = '<span style="color:var(--warn)">⚠️ Kursreihe zu kurz für eine verlässliche Prüfung</span>';
  else if(claimedErfuellt==null) urteil = '<span style="color:var(--muted)">kein Pipeline-Wert zum Vergleich vorhanden</span>';
  else if(abweichend) urteil = '<span style="color:var(--bad)">⚠️ weicht vom Pipeline-Stand ab</span>';
  else urteil = '<span style="color:var(--ok)">✓ bestätigt den Pipeline-Stand</span>';
  return `
    <div class="pivotcard">
      <div class="pdetail">
        <b>Frisch nachgerechnet:</b> ${d.erfuellt}/${d.gesamt} Kriterien erfüllt
        ${claimedErfuellt!=null ? ` &middot; <b>Pipeline-Stand:</b> ${claimedErfuellt}/${d.gesamt}` : ''}
        &middot; ${urteil}
      </div>
      <div class="quickscan" style="margin-top:8px">${rows}</div>
    </div>
    <div style="font-size:10.5px;color:var(--muted);margin-top:2px">
      ${esc(d.quelle)} · kein KI-Aufruf, reine Zahlenprüfung · Stand ${stand} Uhr
    </div>`;
}

async function ladeVerify(ticker, yahooSymbol, claimedWert){
  const wrap = document.getElementById('verifywrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="pivotcard"><div class="pdetail" style="color:var(--muted)">Berechnet die 8 Trend-Template-Kriterien unabhängig aus frischen Kursdaten neu …</div></div>';
  try{
    const u = MTS_PROXY + 'verify?ticker=' + encodeURIComponent(yahooSymbol || ticker);
    const r = await fetch(u, {signal: AbortSignal.timeout(20000)});
    const d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error || ('HTTP '+r.status));
    wrap.innerHTML = renderVerify(d, claimedWert);
  }catch(e){
    wrap.innerHTML = `<div class="pivotcard"><div class="pdetail" style="color:var(--muted)">
      Gegenprüfung gerade nicht verfügbar (${esc((e && e.message) || e)}).
    </div></div>
    <button class="deepbtn" onclick="ladeVerify('${esc(ticker)}','${esc(yahooSymbol)}',${(claimedWert!=null && !isNaN(claimedWert)) ? claimedWert : 'null'})">🔄 Erneut versuchen</button>`;
  }
}

// ─── Ticker wechseln, ohne die Seite zu verlassen (seit 2026-08-16) ─────
// signals.json/pivot.json/priceaction.json sind bis zu ~10 MB gross - werden
// einmal geladen und fuer jeden weiteren Ticker-Wechsel aus dem Speicher neu
// gejoint (finde()), statt bei jedem Wechsel neu zu fetchen. history.pushState
// haelt die URL (und damit Lesezeichen/Teilen-Link sowie den Zurueck-Button)
// mit dem sichtbaren Ticker synchron.
let SIGNALS_CACHE = null, PIVOT_CACHE = null, PA_CACHE = null, BASISDATEN_PROMISE = null;
function ladeBasisdaten(){
  if(!BASISDATEN_PROMISE){
    BASISDATEN_PROMISE = Promise.all([
      ladeJson('data/signals.json'),
      ladeJson('data/pivot.json'),
      ladeJson('../Price-Action-Hub/data/priceaction.json'),
    ]).then(([s,p,pa])=>{ SIGNALS_CACHE=s; PIVOT_CACHE=p; PA_CACHE=pa; });
  }
  return BASISDATEN_PROMISE;
}
async function zeigeTicker(ticker){
  TICKER = (ticker||'').toUpperCase();
  document.getElementById('nf-ticker').textContent = TICKER || '(kein Ticker)';
  document.getElementById('tickerswitch').value = '';
  document.getElementById('content').style.display = 'none';
  document.getElementById('notfound').style.display = 'none';
  if(!TICKER){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('notfound').style.display = '';
    return;
  }
  document.getElementById('loading').style.display = '';
  await ladeBasisdaten();
  const treffer = finde(SIGNALS_CACHE && SIGNALS_CACHE.treffer, TICKER);
  if(!treffer){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('notfound').style.display = '';
    return;
  }
  treffer.__erstellt = SIGNALS_CACHE.erstellt;
  const pivTreffer = finde(PIVOT_CACHE && PIVOT_CACHE.treffer, TICKER);
  const paTreffer = finde(PA_CACHE && PA_CACHE.treffer, TICKER);
  render(treffer, pivTreffer, paTreffer, SIGNALS_CACHE.marktregime);
}
function wechsleTicker(neu){
  const t = (neu||'').trim().toUpperCase();
  if(!t || t===TICKER) return;
  history.pushState({ticker:t}, '', 'setup-detail.html?ticker='+encodeURIComponent(t));
  zeigeTicker(t);
}
window.addEventListener('popstate', ()=>{
  const p = new URLSearchParams(location.search);
  zeigeTicker((p.get('ticker')||'').toUpperCase());
});
zeigeTicker(TICKER);
</script>
